<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Plantões Médicos · Jaborandi/SP</title>
<!-- Arquivo único: CSS e JavaScript embutidos (antes ficavam em assets/style.css e assets/app.js). -->
<style>
:root{
  --azul: #0b5394;
  --azul-esc: #073763;
  --azul-cl: #e8f1fb;
  --verde: #1e8e5a;
  --vermelho: #c0392b;
  --amarelo: #e0a800;
  --cinza-bg: #f4f6f9;
  --cinza-borda: #dde3ea;
  --texto: #1f2937;
  --texto-suave:#6b7280;
  --branco:#fff;
  --raio:10px;
  --sombra: 0 2px 10px rgba(15,40,80,.08);
  font-size:15px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"Segoe UI",Arial,Helvetica,sans-serif;
  background:var(--cinza-bg);
  color:var(--texto);
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

/* ---------- LOGIN ---------- */
.tela-login{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--azul-esc),var(--azul) 60%,#1c9d7c);
  padding:16px;
}
.cartao-login{
  background:var(--branco);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  width:100%;max-width:400px;padding:32px 28px;
}
.cartao-login h1{font-size:1.35rem;margin:0 0 2px;color:var(--azul-esc)}
.cartao-login .sub{color:var(--texto-suave);font-size:.85rem;margin-bottom:20px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:.8rem;font-weight:600;margin-bottom:5px;color:#374151}
.campo input,.campo select,.campo textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--cinza-borda);border-radius:8px;font-size:.95rem;font-family:inherit;
}
.campo input:focus,.campo select:focus{outline:none;border-color:var(--azul)}
.campo-senha{position:relative}
.campo-senha input{padding-right:38px}
.btn-olho{
  position:absolute;right:4px;top:29px;background:none;border:none;cursor:pointer;
  font-size:16px;padding:6px 8px;line-height:1;color:var(--texto-suave);
}
.btn{
  border:none;border-radius:8px;padding:11px 16px;font-weight:600;font-size:.9rem;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primario{background:var(--azul);color:#fff;width:100%}
.btn-primario:hover{background:var(--azul-esc)}
.btn-secundario{background:var(--azul-cl);color:var(--azul-esc)}
.btn-perigo{background:#fdecea;color:var(--vermelho)}
.btn-sucesso{background:#e6f6ee;color:var(--verde)}
.link-alt{background:none;border:none;color:var(--azul);font-size:.85rem;margin-top:12px;width:100%;text-decoration:underline}
.msg-erro{background:#fdecea;color:var(--vermelho);padding:10px 12px;border-radius:8px;font-size:.85rem;margin-bottom:12px}
.msg-ok{background:#e6f6ee;color:var(--verde);padding:10px 12px;border-radius:8px;font-size:.85rem;margin-bottom:12px}
.pendente-box{max-width:420px;margin:80px auto;background:#fff;padding:28px;border-radius:14px;box-shadow:var(--sombra);text-align:center}

/* ---------- APP SHELL ---------- */
.app{display:flex;min-height:100vh}
.barra-lateral{
  width:230px;flex-shrink:0;background:var(--azul-esc);color:#fff;
  display:flex;flex-direction:column;padding:18px 0;
}
.barra-lateral .logo{padding:0 18px 16px;font-weight:700;font-size:1.05rem;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.barra-lateral .logo small{display:block;font-weight:400;font-size:.7rem;opacity:.7;margin-top:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 18px;color:#cfe0f2;text-decoration:none;
  font-size:.88rem;cursor:pointer;border-left:3px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.07)}
.nav-item.ativo{background:rgba(255,255,255,.12);border-left-color:#4fd1c5;color:#fff;font-weight:600}
.rodape-lateral{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:.78rem}
.rodape-lateral .perfil-tag{display:inline-block;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:20px;margin-top:4px;font-size:.7rem}
.rodape-lateral button{background:none;border:none;color:#f8b4a8;font-size:.78rem;margin-top:8px;padding:0;text-decoration:underline}

.conteudo{flex:1;min-width:0;padding:22px 26px;overflow-x:auto}
.cabecalho-pagina{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.cabecalho-pagina h2{margin:0;font-size:1.3rem;color:var(--azul-esc)}
.cabecalho-pagina .desc{color:var(--texto-suave);font-size:.85rem;margin-top:2px}

.abrir-menu-mobile{display:none}

.cartao{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);padding:18px;margin-bottom:18px}
.grade-cartoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);padding:16px 18px;border-left:4px solid var(--azul)}
.kpi .valor{font-size:1.6rem;font-weight:700;color:var(--azul-esc)}
.kpi .rotulo{font-size:.78rem;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.03em}
.kpi.k-verde{border-left-color:var(--verde)}
.kpi.k-amarelo{border-left-color:var(--amarelo)}
.kpi.k-vermelho{border-left-color:var(--vermelho)}

.grafico-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.grafico-grid .cartao canvas{max-height:280px}
@media(max-width:900px){.grafico-grid{grid-template-columns:1fr}}

table.tabela{border-collapse:collapse;width:100%;font-size:.85rem}
table.tabela th,table.tabela td{padding:8px 10px;border-bottom:1px solid var(--cinza-borda);text-align:left;white-space:nowrap}
table.tabela th{background:var(--azul-cl);color:var(--azul-esc);position:sticky;top:0}
table.tabela tr:hover td{background:#fafcff}

.barra-ferramentas{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.barra-ferramentas select,.barra-ferramentas input{padding:8px 10px;border:1px solid var(--cinza-borda);border-radius:8px}

/* ---------- ESCALA GRID ---------- */
.wrapper-escala{overflow:auto;border:1px solid var(--cinza-borda);border-radius:8px}
table.escala{border-collapse:collapse;font-size:.78rem}
table.escala th,table.escala td{border:1px solid var(--cinza-borda);text-align:center;padding:0}
table.escala th{background:var(--azul-cl);color:var(--azul-esc);padding:6px 4px;position:sticky;top:0;z-index:2}
table.escala td.nome-prof{
  text-align:left;padding:6px 10px;white-space:nowrap;font-weight:600;position:sticky;left:0;background:#fff;z-index:1;
  min-width:210px;line-height:1.3;
}
table.escala th.col-nome{position:sticky;left:0;z-index:3;min-width:210px;text-align:left;padding-left:10px}
table.escala td.dia{width:30px;height:30px;cursor:pointer;font-weight:700;user-select:none}
table.escala td.dia.fds{background:#fbf3e0}
td.dia.dia-minha{outline:2px dashed var(--azul);outline-offset:-2px;cursor:pointer}
table.escala td.dia:hover{outline:2px solid var(--azul)}
td.codigo-N{background:#2c3e70;color:#fff}
td.codigo-D{background:#ffe9a8;color:#7a5b00}
td.codigo-T{background:#ffd0a8;color:#8a4200}
td.codigo-M{background:#d5f2d0;color:#1e5c1a}
td.codigo-24{background:var(--vermelho);color:#fff}
td.codigo-18{background:#c98bd6;color:#fff}
td.codigo-6{background:#a8d8ff;color:#003a63}
td.codigo-F{background:#c9c9c9;color:#333}
td.codigo-V{background:#0b8f8f;color:#fff}
td.total-linha{font-weight:700;background:var(--azul-cl);position:sticky;right:0}
.legenda-codigos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:.78rem}
.legenda-codigos span{padding:3px 9px;border-radius:6px;font-weight:700}

.modal-fundo{position:fixed;inset:0;background:rgba(15,25,45,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;padding:22px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin-top:0;color:var(--azul-esc)}
.modal .campos-2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.modal .acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

.badge{padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:700}
.badge-verde{background:#e6f6ee;color:var(--verde)}
.badge-vermelho{background:#fdecea;color:var(--vermelho)}
.badge-cinza{background:#eee;color:#555}
.badge-azul{background:var(--azul-cl);color:var(--azul-esc)}
.badge-amarelo{background:#fff6dd;color:#946200}

.icone-acao{border:none;background:none;font-size:1rem;cursor:pointer;padding:4px 6px;border-radius:6px}
.icone-acao:hover{background:var(--cinza-bg)}

.linha-codigo{display:flex;gap:6px;align-items:center}
.linha-codigo input[type="text"],.linha-codigo input:not([type]){padding:8px;border:1.5px solid var(--cinza-borda);border-radius:6px}
.linha-codigo .cNome{flex:1;padding:8px;border:1.5px solid var(--cinza-borda);border-radius:6px}
.linha-codigo .cCodigo,.linha-codigo .cHoras{padding:8px;border:1.5px solid var(--cinza-borda);border-radius:6px}
.linha-codigo .cCor{width:38px;height:36px;border:1.5px solid var(--cinza-borda);border-radius:6px;padding:2px;background:#fff}

@media print{
  .barra-lateral,.cabecalho-pagina .acoes-topo,.barra-ferramentas,.abrir-menu-mobile{display:none!important}
  .conteudo{padding:0}
  body{background:#fff}
}

/* ---------- CALENDÁRIO DE CONSULTA DE ESCALAS ---------- */
table.calendario-consulta{width:100%;border-collapse:collapse;table-layout:fixed}
table.calendario-consulta th{background:var(--azul-cl);color:var(--azul-esc);padding:8px;font-size:.8rem;border:1px solid var(--cinza-borda)}
table.calendario-consulta td{border:1px solid var(--cinza-borda);vertical-align:top;height:90px;padding:4px;width:14.28%}
table.calendario-consulta td.dia-vazio{background:#fafafa}
table.calendario-consulta .num-dia{font-size:.75rem;font-weight:700;color:#6b7280;margin-bottom:3px}
.entrada-cal{font-size:.7rem;padding:2px 5px;border-radius:5px;margin-bottom:2px;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.entrada-cal small{opacity:.85}
@media(max-width:820px){
  table.calendario-consulta td{height:auto;min-height:60px;font-size:.7rem}
}

@media(max-width:820px){
  .barra-lateral{
    position:fixed;left:-250px;top:0;bottom:0;z-index:40;transition:left .2s;width:230px;
  }
  .barra-lateral.aberta{left:0}
  .abrir-menu-mobile{
    display:inline-flex;background:var(--azul-esc);color:#fff;border:none;border-radius:8px;
    padding:8px 12px;font-size:1rem;margin-right:8px;
  }
  .conteudo{padding:16px}
  .grafico-grid{grid-template-columns:1fr}
}

/* =====================================================================
   MELHORIAS 5.05.2026 — Escala Semanal no estilo PegaPlantão e afins
   ===================================================================== */
.versao-app{margin-top:10px;font-size:.68rem;opacity:.65}
.versao-login{margin-top:16px;text-align:center;font-size:.72rem;color:var(--texto-suave)}
.nav-badge{margin-left:auto;background:#f59e0b;color:#1f2937;border-radius:20px;font-size:.7rem;font-weight:700;padding:1px 8px}
.cartao-destaque{border-left:4px solid #1e88e5}

/* ---- barra superior azul ---- */
.ps-topo{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  background:#1e6fc9;color:#fff;border-radius:var(--raio) var(--raio) 0 0;padding:12px 16px}
.ps-trilha{font-size:1.05rem;letter-spacing:.02em;color:#cfe6ff}
.ps-trilha b{color:#fff;font-weight:600}
.ps-topo-direita{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ps-topo-direita input,.ps-topo-direita select{padding:8px 12px;border-radius:6px;border:1px solid #3d86d6;background:#2a7fd6;color:#fff;min-width:200px}
.ps-topo-direita input::placeholder{color:#d6e9ff}
.ps-topo-direita select option{color:#1f2937;background:#fff}
.ps-topo-direita .btn{padding:8px 12px}
.ps-aviso{background:#fff6dd;border:1px solid #f1d58a;color:#7a5b00;border-radius:8px;padding:9px 12px;font-size:.85rem;margin:10px 0}

/* ---- grade semanal ---- */
.ps-rolagem{overflow-x:auto;background:#fff;box-shadow:var(--sombra);border-radius:0 0 var(--raio) var(--raio);margin-bottom:10px}
.ps-grade{display:grid;grid-template-columns:200px repeat(7,minmax(128px,1fr));min-width:1100px}
.ps-cab-mes{background:#3b4a5c;color:#fff;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;font-weight:600;font-size:.9rem}
.ps-cab-mes small{opacity:.7;font-weight:400}
.ps-rotulo-mes{flex:1 1 100%;order:-1}
.ps-seta{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:6px;width:28px;height:26px;font-size:1.1rem;line-height:1}
.ps-seta:hover{background:rgba(255,255,255,.25)}
.ps-hoje{background:#4fd1c5;border:none;color:#073763;border-radius:6px;padding:3px 9px;font-weight:700;font-size:.75rem}
.ps-cab-mes input[type=date]{width:118px;font-size:.72rem;padding:2px 4px;border-radius:5px;border:none}
.ps-cab-dia{background:#4a5a6e;color:#fff;text-align:center;padding:8px 4px;border-left:1px solid #5b6b80;display:flex;flex-direction:column;justify-content:center}
.ps-cab-dia .ps-num{font-size:1.25rem;font-weight:300}
.ps-cab-dia .ps-sem{font-size:.72rem;letter-spacing:.05em;opacity:.85}
.ps-cab-dia.ps-hoje-col{background:#2f3d4d}
.ps-cab-dia.ps-hoje-col .ps-num{color:#4fd1c5;font-weight:600}

.ps-setor{padding:12px 10px;border-top:1px solid var(--cinza-borda);background:#fafbfc;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ps-setor-nome{font-weight:700;color:#3b4a5c;font-size:.92rem;text-transform:uppercase}
.ps-mini{font-size:.72rem;color:var(--texto-suave)}
.btn-replicar{background:#fff;border:1.5px solid #1e6fc9;color:#1e6fc9;border-radius:5px;padding:5px 10px;font-weight:600;font-size:.8rem}
.btn-replicar:hover{background:#e8f1fb}
.chip-liberacao{border-radius:5px;padding:4px 9px;font-size:.74rem;font-weight:700;border:1.5px solid}
button.chip-liberacao{cursor:pointer;background:#fff}
.chip-liberacao.lib-nao{border-color:#e57373;color:#b42318;background:#fff}
.chip-liberacao.lib-sim{border-color:#7cc59b;color:#1e6b43;background:#effaf3}

.ps-celula{border-top:1px solid var(--cinza-borda);border-left:1px solid #eef1f4;padding:6px;display:flex;flex-direction:column;gap:5px;min-height:70px;background:#fff}
.ps-celula.ps-hoje-col{background:#f4fbfb}
.ps-celula.ps-fechada{background:repeating-linear-gradient(45deg,#fff,#fff 8px,#f6f7f9 8px,#f6f7f9 16px)}
.ps-card{position:relative;display:flex;justify-content:space-between;gap:6px;background:#fff;border:1px solid #e3e7ec;border-left:4px solid #1e8e5a;
  border-radius:4px;padding:6px 8px 6px 7px;box-shadow:0 1px 2px rgba(0,0,0,.05);font-size:.74rem;min-height:44px}
.ps-card.ps-clicavel{cursor:pointer}
.ps-card.ps-clicavel:hover{box-shadow:0 2px 8px rgba(30,111,201,.25);border-color:#9cc3ec}
.ps-card-nome{font-weight:600;color:#374151;line-height:1.25;text-transform:uppercase;word-break:break-word}
.ps-card-hora{font-size:.68rem;color:#6b7280;text-align:right;line-height:1.35;white-space:nowrap}
.ps-card-cod{position:absolute;right:-1px;bottom:-1px;font-size:.58rem;font-weight:700;padding:0 4px;border-radius:4px 0 4px 0;line-height:1.5}
.ps-card{padding-bottom:12px}
.ps-card-meu{outline:2px solid #1e88e5;outline-offset:-2px}
.ps-card-previa{background:#fbfbfb;border-style:dashed;border-left-style:solid;opacity:.85}
.ps-add{background:#f7f8fa;border:1px solid #e3e7ec;border-radius:4px;color:#9ca3af;font-size:1.1rem;min-height:30px;margin-top:auto}
.ps-add:hover{background:#e8f1fb;color:#1e6fc9;border-color:#9cc3ec}
.ps-vazio{grid-column:1 / -1;padding:24px;text-align:center;color:var(--texto-suave)}
.ps-rodape-ajuda{font-size:.78rem;color:var(--texto-suave);margin:4px 2px 16px}
.ps-alerta{background:#fff6dd;border:1px solid #f1d58a;border-radius:6px;padding:7px 9px;margin-top:6px;color:#5c4400}

/* ---- plantonistas de hoje (Painel) ---- */
.hoje-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px}
.hoje-card{min-height:48px}
.hoje-agora{background:#effaf3}

/* ---- grade mensal ---- */
table.escala th.col-hoje{background:#1e6fc9;color:#fff}
table.escala td.col-hoje:not([style*="background"]){background:#f4fbfb}
table.escala tfoot td{font-size:.72rem;font-weight:700;color:#3b4a5c;background:#f4f6f9;height:24px}
table.escala tfoot td.cob-zero{background:#fdecea;color:var(--vermelho)}
table.escala tfoot td.nome-prof{background:#f4f6f9}

/* ---- calendário de consulta ---- */
table.calendario-consulta td.cal-hoje{background:#f4fbfb;outline:2px solid #4fd1c5;outline-offset:-2px}
.entrada-cal.entrada-previa{outline:1.5px dashed rgba(0,0,0,.45);outline-offset:-2px}
.entrada-cal.entrada-minha{box-shadow:inset 0 0 0 2px #1e88e5}

/* ---- filtros / busca ---- */
.filtro-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-filtro{border:1px solid var(--cinza-borda);background:#fff;border-radius:20px;padding:5px 12px;font-size:.8rem;color:#374151}
.chip-filtro.ativo{background:var(--azul);border-color:var(--azul);color:#fff}
.busca-tabela{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.busca-tabela input{flex:1;max-width:420px;padding:9px 12px;border:1.5px solid var(--cinza-borda);border-radius:8px;font-size:.88rem}
.busca-tabela .busca-contagem{font-size:.78rem;color:var(--texto-suave)}

@media(max-width:820px){
  .ps-topo-direita input,.ps-topo-direita select{min-width:0;flex:1 1 150px}
  .ps-grade{grid-template-columns:150px repeat(7,minmax(118px,1fr))}
}
@media print{
  .ps-acao,.ps-add,.btn-replicar,.ps-topo-direita,.ps-rodape-ajuda,.busca-tabela,.filtro-chips,#areaHojeDash{display:none!important}
  .ps-rolagem{overflow:visible;box-shadow:none}
  .ps-grade{min-width:0;grid-template-columns:120px repeat(7,1fr)}
  .ps-topo{background:#fff;color:#000;border-bottom:2px solid #000}
  .ps-trilha,.ps-trilha b{color:#000}
  .ps-cab-mes,.ps-cab-dia{background:#eee!important;color:#000!important}
  .ps-card{break-inside:avoid;font-size:.62rem}
  .modal-fundo{display:none!important}
}

</style>
</head>
<body>

<div id="app">
  <div class="tela-login">
    <div class="cartao-login">
      <h1>🏥 Carregando...</h1>
      <div class="sub">Controle de Plantões Médicos</div>
    </div>
  </div>
</div>

<!-- Firebase (Autenticação + Banco de dados Firestore) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<!-- Gráficos -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<!-- Exportação para Excel (.xlsx) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- E-mail (opcional, usado só nas Trocas de Plantão) -->

auth.onAuthStateChanged(async (user) => {
  if (LINK_TROCA) return; // a resposta por link é tratada à parte, sem depender de login
  if (!user) { ESTADO.usuario = null; ESTADO.usuarioDoc = null; renderLogin(); return; }
  ESTADO.usuario = user;
  const ref = db.collection("usuarios").doc(user.uid);
  const snap = await ref.get();
  if (!snap.exists) {
    const novo = { nome: user.email.split("@")[0], email: user.email, perfil: "pendente", ativo: false, criadoEm: Date.now() };
    await ref.set(novo);
    ESTADO.usuarioDoc = novo;
  } else {
    ESTADO.usuarioDoc = snap.data();
  }
  if (!ESTADO.usuarioDoc.ativo) { renderPendente(); return; }
  await carregarDadosIniciais();
  await iniciarLogSessao();
  renderApp();
});

// ---- Esqueci minha senha ----
// O Firebase Authentication é quem guarda a senha de cada pessoa — nem o sistema, nem o
// administrador, conseguem "ver" ou recuperar a senha anterior (isso é proposital, para
// proteger todo mundo: se a senha pudesse ser recuperada e viajar por e-mail, ela ficaria
// exposta). Por isso o fluxo funciona assim:
// 1) O Firebase envia, AUTOMATICAMENTE e de verdade, um e-mail com um link seguro para o
//    PRÓPRIO usuário definir uma senha nova (não depende de nenhuma configuração extra).
// 2) O administrador também recebe um aviso (por e-mail, via EmailJS, se configurado) para
//    saber que o pedido aconteceu.
async function esqueciMinhaSenha() {
  let email = document.getElementById("loginEmail")?.value.trim().toLowerCase();
  if (!email) email = (prompt("Informe o e-mail da sua conta para receber o link de nova senha:") || "").trim().toLowerCase();
  if (!email) return;
  try {
    await auth.sendPasswordResetEmail(email);
    mostrarMsg(`Enviamos um e-mail para ${email} com um link seguro para você definir uma nova senha. Confira também a caixa de spam.`, "ok");
  } catch (err) {
    mostrarMsg(traduzErro(err), "erro");
    return;
  }
  // Aviso ao administrador (best-effort — não bloqueia o fluxo do usuário se falhar).
  const corpo = `
    <p>Um usuário solicitou uma nova senha de acesso ao <b>Controle de Plantões Médicos</b>.</p>
    <p><b>Usuário (e-mail):</b> ${escapeHtml(email)}<br>
    <b>Nome:</b> não disponível neste momento (o pedido é feito antes do login)<br>
    <b>E-mail:</b> ${escapeHtml(email)}<br>
    <b>Perfil:</b> não disponível neste momento (o pedido é feito antes do login)</p>
    <p>Um e-mail com um link seguro para redefinir a senha já foi enviado automaticamente pelo Firebase
    diretamente para o usuário acima. Se quiser confirmar os dados completos (nome e perfil) dessa
    pessoa, procure pelo e-mail ${escapeHtml(email)} na tela "Usuários e Perfis".</p>`;
  try { await enviarEmail(EMAIL_ADMINISTRADOR, "Solicitação de nova senha — Controle de Plantões", corpo); }
  catch (err) { console.warn("Aviso ao administrador não enviado:", err); }
}

// ---- Bloqueio por tentativas de login ----
// Guarda um contador de tentativas por e-mail em dois lugares:
//  - localStorage (neste navegador): mostra o aviso de "4 tentativas" instantaneamente.
//  - Firestore, coleção "tentativasLogin/{email}": é o que garante o bloqueio de verdade,
//    valendo em qualquer computador/navegador, não só neste. Precisa das regras do
//    Firestore atualizadas (veja firestore.rules) para funcionar — se as regras ainda não
//    tiverem sido publicadas, o aviso de "4 tentativas" deste navegador continua funcionando,
//    mas o bloqueio de verdade (5ª tentativa) só é aplicado depois de publicá-las.
function lerTentativasLocal() {
  try { return JSON.parse(localStorage.getItem("cpm_login_tentativas") || "{}"); } catch (e) { return {}; }
}
function salvarTentativasLocal(obj) {
  try { localStorage.setItem("cpm_login_tentativas", JSON.stringify(obj)); } catch (e) {}
}
function registrarTentativaLocalFalha(email) {
  const t = lerTentativasLocal();
  t[email] = (t[email] || 0) + 1;
  salvarTentativasLocal(t);
  return t[email];
}
function limparTentativasLocal(email) {
  const t = lerTentativasLocal();
  delete t[email];
  salvarTentativasLocal(t);
}
async function verificarBloqueioLogin(email) {
  try {
    const doc = await db.collection("tentativasLogin").doc(email).get();
    if (doc.exists && doc.data().bloqueado) return { bloqueado: true };
  } catch (err) { /* regras ainda não publicadas ou offline — segue sem bloqueio remoto */ }
  return { bloqueado: false };
}
async function registrarFalhaLoginRemoto(email) {
  try {
    const ref = db.collection("tentativasLogin").doc(email);
    const doc = await ref.get();
    if (!doc.exists) {
      await ref.set({ tentativas: 1, ultimaTentativa: Date.now(), bloqueado: false });
    } else {
      const n = (doc.data().tentativas || 0) + 1;
      await ref.set({ tentativas: n, ultimaTentativa: Date.now(), bloqueado: n >= 5 });
    }
  } catch (err) { /* regras ainda não publicadas ou offline — o aviso local continua valendo */ }
}
async function resetarTentativasLoginRemoto(email) {
  try { await db.collection("tentativasLogin").doc(email).set({ tentativas: 0, ultimaTentativa: Date.now(), bloqueado: false }); }
  catch (err) { /* sem permissão fora de login ainda válido — sem problema, próxima falha recomeça do zero mesmo assim se o doc não existir */ }
}

// ---- Log de Acesso (só o Administrador vê) ----
// Registra usuário, data, hora início, hora final e os comandos (telas) acessados em cada
// sessão. Guardado na coleção "logsAcesso" do Firestore. Cada pessoa só consegue criar/
// atualizar os PRÓPRIOS registros de sessão (ver firestore.rules); somente o Administrador
// consegue ler a lista completa de todo mundo.
async function iniciarLogSessao() {
  if (ESTADO.logSessaoId) return; // já iniciada nesta aba/sessão
  const agora = new Date();
  const dados = {
    uid: ESTADO.usuario.uid,
    usuarioNome: ESTADO.usuarioDoc.nome || ESTADO.usuario.email,
    usuarioEmail: ESTADO.usuario.email,
    data: agora.toLocaleDateString("pt-BR"),
    horaInicio: agora.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" }),
    horaFinal: "",
    comandos: [],
    criadoEm: Date.now(),
  };
  try {
    const ref = await db.collection("logsAcesso").add(dados);
    ESTADO.logSessaoId = ref.id;
    ESTADO.logComandos = [];
  } catch (err) { console.warn("Não foi possível iniciar o log de acesso (verifique se as regras do Firestore foram publicadas):", err); }
}
function registrarComandoLog(nomeTela) {
  if (!ESTADO.logSessaoId) return;
  const agora = new Date();
  const horaFinal = agora.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
  ESTADO.logComandos.push(`${nomeTela} (${horaFinal})`);
  db.collection("logsAcesso").doc(ESTADO.logSessaoId).update({ comandos: ESTADO.logComandos, horaFinal }).catch(err => console.warn(err));
}
function finalizarLogSessao() {
  if (!ESTADO.logSessaoId) return;
  const horaFinal = new Date().toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
  db.collection("logsAcesso").doc(ESTADO.logSessaoId).update({ horaFinal }).catch(() => {});
}
window.addEventListener("beforeunload", finalizarLogSessao);
async function renderLogAcesso() {
  const vp = document.getElementById("viewport");
  vp.innerHTML = `<div class="cartao">Carregando...</div>`;
  const snap = await db.collection("logsAcesso").orderBy("criadoEm", "desc").limit(500).get();
  const logs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  vp.innerHTML = `
    <div class="cabecalho-pagina"><div><h2>Log de Acesso</h2><div class="desc">Quem usou o sistema: usuário, data, hora de início, hora final e as telas acessadas em cada sessão. Mostrando as 500 sessões mais recentes.</div></div></div>
    <div class="cartao" style="overflow:auto">
      <table class="tabela">
        <thead><tr><th>Usuário</th><th>Data</th><th>Hora Início</th><th>Hora Final</th><th>Comandos acessados</th></tr></thead>
        <tbody>
          ${logs.length===0 ? `<tr><td colspan="5">Nenhum acesso registrado ainda.</td></tr>` :
            logs.map(l => `<tr>
              <td>${escapeHtml(l.usuarioNome || l.usuarioEmail)}</td>
              <td>${escapeHtml(l.data)}</td>
              <td>${escapeHtml(l.horaInicio)}</td>
              <td>${escapeHtml(l.horaFinal) || "—"}</td>
              <td style="white-space:normal;min-width:280px">${(l.comandos && l.comandos.length) ? escapeHtml(l.comandos.join(" → ")) : "—"}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

async function carregarDadosIniciais() {
  // Tipos de escala
  let snap = await db.collection("tiposEscala").get();
  if (snap.empty) {
    const lote = db.batch();
    TIPOS_ESCALA_PADRAO.forEach(t => lote.set(db.collection("tiposEscala").doc(t.id), { nome:t.nome, codigos:t.codigos, criadoEm: Date.now() }));
    await lote.commit();
    snap = await db.collection("tiposEscala").get();
  }
  ESTADO.cacheTiposEscala = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>a.nome.localeCompare(b.nome));

  // Valores de plantão
  let vsnap = await db.collection("valoresPlantao").get();
  if (vsnap.empty) {
    const lote = db.batch();
    VALORES_PADRAO.forEach(v => lote.set(db.collection("valoresPlantao").doc(), v));
    await lote.commit();
    vsnap = await db.collection("valoresPlantao").get();
  }
  ESTADO.cacheValoresPlantao = vsnap.docs.map(d => ({ id:d.id, ...d.data() }));

  // Perfis de acesso (permissões por tela)
  let psnap = await db.collection("perfis").get();
  if (psnap.empty) {
    const lote = db.batch();
    PERFIS_PADRAO.forEach(p => lote.set(db.collection("perfis").doc(p.id), { nome:p.nome, cor:p.cor, protegido:!!p.protegido, permissoes:p.permissoes }));
    await lote.commit();
    psnap = await db.collection("perfis").get();
  }
  ESTADO.cachePerfis = psnap.docs.map(d => ({ id:d.id, ...d.data() }));

  // Entidades (locais/unidades onde os plantões acontecem) - sem seed padrão, cadastro livre
  const esnap = await db.collection("entidades").get();
  ESTADO.cacheEntidades = esnap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>(a.nomeFantasia||a.razaoSocial||"").localeCompare(b.nomeFantasia||b.razaoSocial||""));
}

function buscarValorHora(setorId, categoria) {
  const lista = ESTADO.cacheValoresPlantao;
  const combos = [
    v => v.setorId === setorId && v.categoria === categoria,
    v => v.setorId === setorId && v.categoria === "Todos",
    v => v.setorId === "todos" && v.categoria === categoria,
    v => v.setorId === "todos" && v.categoria === "Todos",
  ];
  for (const teste of combos) { const achado = lista.find(teste); if (achado) return achado.valorHora; }
  return 0;
}

// Este é o único lugar do sistema em que dá para checar "a senha nova não pode ser igual à
// anterior": o Firebase Authentication nunca revela a senha atual para o sistema (nem em
// hash) — só aqui, no momento em que a própria pessoa digita a senha atual E a nova, é
// possível comparar as duas. Nas redefinições feitas por link de e-mail (Firebase) essa
// checagem não é possível, pois o link não passa pelo nosso sistema.
function modalTrocarSenha() {

      </div>
      <div class="acoes">
        <button class="btn btn-secundario" id="tsCancelar">Cancelar</button>
        <button class="btn btn-primario" id="tsSalvar" style="width:auto">Salvar nova senha</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  div.querySelectorAll(".btn-olho").forEach(b => b.addEventListener("click", () => {
    const input = div.querySelector("#" + b.dataset.alvo);
    if (input) input.type = (input.type === "password") ? "text" : "password";
  }));
  div.querySelector("#tsCancelar").addEventListener("click", () => div.remove());
  div.querySelector("#tsSalvar").addEventListener("click", async () => {
    const areaMsg = div.querySelector("#areaMsgTrocarSenha");
    const senhaAtual = div.querySelector("#tsSenhaAtual").value;
    const senhaNova = div.querySelector("#tsSenhaNova").value;
    if (!senhaAtual || !senhaNova) { areaMsg.innerHTML = `<div class="msg-erro">Preencha a senha atual e a nova senha.</div>`; return; }
    if (senhaNova.length < 6) { areaMsg.innerHTML = `<div class="msg-erro">A nova senha precisa ter pelo menos 6 caracteres.</div>`; return; }
    if (senhaNova === senhaAtual) { areaMsg.innerHTML = `<div class="msg-erro">A nova senha não pode ser igual à senha anterior.</div>`; return; }
    try {
      const cred = firebase.auth.EmailAuthProvider.credential(ESTADO.usuario.email, senhaAtual);

    }
  });
}
function fmtMoeda(v) { return (v || 0).toLocaleString("pt-BR", { style:"currency", currency:"BRL" }); }
function corTexto(hex) {
  if (!hex) return "#111";
  const c = hex.replace("#","");
  const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  const lum = (0.299*r+0.587*g+0.114*b)/255;
  return lum > 0.62 ? "#1f2937" : "#ffffff";
}
function fmtData2(d) { return String(d).padStart(2,"0"); }
// Retorna {inicioTexto:"02/08/2026 07:00", fimTexto:"02/08/2026 19:00"} a partir do dia/mês/ano + código do tipo de escala
function periodoDoTurno(ano, mes, dia, infoCodigo) {
  const inicio = infoCodigo?.inicio || "07:00";
  const horas = infoCodigo?.horas || 0;
  const [hh,mm] = inicio.split(":").map(Number);
  const dtInicio = new Date(ano, mes-1, dia, hh, mm);
  const dtFim = new Date(dtInicio.getTime() + horas*60*60*1000);
  const fmt = dt => `${fmtData2(dt.getDate())}/${fmtData2(dt.getMonth()+1)}/${dt.getFullYear()} ${fmtData2(dt.getHours())}:${fmtData2(dt.getMinutes())}`;
  return { inicioTexto: fmt(dtInicio), fimTexto: fmt(dtFim) };
}

// Envia e-mail via EmailJS se configurado; se não estiver configurado, não faz nada
// (a notificação dentro do sistema, na tela "Trocas de Plantão", sempre funciona).
async function enviarEmail(paraEmail, assunto, corpoHtml) {
  if (!paraEmail || !EMAILJS_CONFIG?.publicKey || !EMAILJS_CONFIG?.serviceId || !EMAILJS_CONFIG?.templateId || !window.emailjs) return false;
  try {
    await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, { to_email: paraEmail, subject: assunto, corpo: corpoHtml, corpo_html: corpoHtml });
    return true;
  } catch (err) { console.warn("Falha ao enviar e-mail (a notificação interna do sistema continua funcionando):", err); return false; }
}

const TIPOS_AFASTAMENTO = ["Falta","Férias","Atestado Médico","Licença Maternidade/Paternidade","Licença Prêmio","Outro"];

async function modalAfastamentos(prof) {
  const div = document.createElement("div");
  div.className = "modal-fundo";
  div.innerHTML = `<div class="modal" style="max-width:560px"><h3>Afastamentos/Faltas — ${escapeHtml(prof.nome)}</h3><div id="areaAfast">Carregando...</div></div>`;
  document.body.appendChild(div);
  div.addEventListener("click", (e) => { if (e.target === div) div.remove(); });

  async function recarregar() {
    const snap = await db.collection("afastamentos").where("profissionalId","==",prof.id).get();
    const lista = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>b.dataInicio.localeCompare(a.dataInicio));
    document.getElementById("areaAfast").innerHTML = `
      <div class="campos-2">
        <div class="campo"><label>Tipo</label><select id="afTipo">${TIPOS_AFASTAMENTO.map(t=>`<option>${t}</option>`).join("")}</select></div>
        <div class="campo"><label>Motivo/Observação</label><input id="afMotivo" placeholder="Opcional"></div>
        <div class="campo"><label>Data início</label><input type="date" id="afInicio"></div>
        <div class="campo"><label>Data fim</label><input type="date" id="afFim"></div>
      </div>
      <button class="btn btn-secundario" id="afAdicionar">+ Adicionar</button>
      <table class="tabela" style="margin-top:14px">
        <thead><tr><th>Tipo</th><th>Início</th><th>Fim</th><th>Motivo</th><th></th></tr></thead>
        <tbody>
          ${lista.map(a => `<tr>
            <td>${escapeHtml(a.tipo)}</td><td>${a.dataInicio}</td><td>${a.dataFim}</td><td>${escapeHtml(a.motivo||"-")}</td>
            <td><button class="icone-acao" data-excluirAf="${a.id}">🗑️</button></td>
          </tr>`).join("") || `<tr><td colspan="5">Nenhum registro.</td></tr>`}
        </tbody>
      </table>
      <div class="acoes"><button class="btn btn-secundario" id="afFechar">Fechar</button></div>`;

    document.getElementById("afAdicionar").addEventListener("click", async () => {
      const dataInicio = document.getElementById("afInicio").value;
      const dataFim = document.getElementById("afFim").value || dataInicio;
      if (!dataInicio) { alert("Informe a data de início."); return; }
      await db.collection("afastamentos").add({
        profissionalId: prof.id, profissionalNome: prof.nome,
        tipo: document.getElementById("afTipo").value,
        motivo: document.getElementById("afMotivo").value.trim(),
        dataInicio, dataFim, criadoEm: Date.now(),
      });
      recarregar();
    });
    document.getElementById("afFechar").addEventListener("click", () => div.remove());
    document.querySelectorAll("[data-excluirAf]").forEach(b => b.addEventListener("click", async () => {
      await db.collection("afastamentos").doc(b.dataset.excluiraf).delete();
      recarregar();
    }));
  }
  recarregar();
}

// 5b. ENTIDADES (locais/unidades onde os plantões acontecem — CNPJ, endereço etc.)

async function carregarEntidades(forcar=false) {
  if (ESTADO.cacheEntidades.length && !forcar) return ESTADO.cacheEntidades;
  return recarregarEntidades().then(() => ESTADO.cacheEntidades);
}

function nomeEntidade(id) {
  if (!id) return "—";
  const e = ESTADO.cacheEntidades.find(x => x.id === id);
  return e ? (e.nomeFantasia || e.razaoSocial) : "—";
}

async function renderEntidades() {
  const vp = document.getElementById("viewport");
  vp.innerHTML = `<div class="cartao">Carregando...</div>`;
  const lista = await carregarEntidades(true);

  const veEscalas = podeVerTela("escala-semanal");

  vp.innerHTML = `
    <div class="cabecalho-pagina">
      <div><h2>Cadastro de Entidades</h2><div class="desc">Os locais/unidades onde os plantões acontecem (ex.: UPA Central, Hospital Municipal). Vincule profissionais e escalas a cada uma.</div></div>
      ${podeEditar ? `<button class="btn btn-primario" id="btnNovaEntidade">+ Nova entidade</button>` : ""}

            <td>${escapeHtml(e.bairro||"-")}</td>
            <td>${escapeHtml(e.telefone||"-")}</td>
            <td>${qtdEscalas(e.id)}</td>
            <td>${qtdProfs(e.id)}</td>
            <td>${e.ativo !== false ? '<span class="badge badge-verde">Ativa</span>' : '<span class="badge badge-vermelho">Inativa</span>'}</td>
            <td>${veEscalas ? `<button class="icone-acao" data-semanal="${e.id}" title="Ver a escala semanal desta unidade">📆</button>` : ""}${podeEditar ? `<button class="icone-acao" data-editar="${e.id}" title="Editar">✏️</button><button class="icone-acao" data-excluir="${e.id}" title="Excluir">🗑️</button>` : ""}</td>
          </tr>`).join("") || `<tr><td colspan="9">Nenhuma entidade cadastrada ainda.</td></tr>`}
        </tbody>
      </table>
    </div>`;

  vp.querySelectorAll("[data-semanal]").forEach(b => b.addEventListener("click", () => {
    ESTADO_SEMANAL.entidadeId = b.dataset.semanal; ESTADO_SEMANAL.busca = "";
    ESTADO.telaAtual = "escala-semanal"; renderApp();
  }));
  if (!podeEditar) return;
  document.getElementById("btnNovaEntidade").addEventListener("click", () => modalEntidade());
  vp.querySelectorAll("[data-editar]").forEach(b => b.addEventListener("click", () => modalEntidade(lista.find(e=>e.id===b.dataset.editar))));
  vp.querySelectorAll("[data-excluir]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("Excluir esta entidade? Profissionais e escalas vinculados a ela ficarão sem vínculo (os dados deles continuam intactos).")) return;
    await db.collection("entidades").doc(b.dataset.excluir).delete();

  }));

      <div class="campos-2" style="margin-top:8px">
        <div class="campo"><label>Latitude</label><input id="eLat" placeholder="Ex.: -21.2989" value="${e.latitude??""}"></div>
        <div class="campo"><label>Longitude</label><input id="eLng" placeholder="Ex.: -48.9128" value="${e.longitude??""}"></div>
        <div class="campo"><label>Distância máxima permitida (metros)</label><input type="number" id="eRaio" value="${e.raioMetros??200}"></div>
      </div>
      <button type="button" class="btn btn-secundario" id="btnUsarLocalAtual">📍 Usar minha localização atual</button>
      <p style="font-size:.75rem;color:#6b7280;margin-top:6px">Fique parado dentro da unidade e clique no botão acima — ele preenche latitude/longitude automaticamente. A partir dessa distância, o Ponto Digital <b>bloqueia</b> a marcação por biometria/senha (só um gestor pode lançar manualmente nesse caso).</p>
      <div class="campo" style="margin-top:10px"><label><input type="checkbox" id="eAtivo" ${e.ativo!==false?"checked":""}> Ativa</label></div>
      <div class="acoes">
        <button class="btn btn-secundario" id="mCancelar">Cancelar</button>
        <button class="btn btn-primario" id="mSalvar">Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  div.querySelector("#btnUsarLocalAtual").addEventListener("click", () => {
    if (!navigator.geolocation) { alert("Seu navegador não suporta geolocalização."); return; }
    const btn = div.querySelector("#btnUsarLocalAtual"); btn.disabled = true; btn.textContent = "Obtendo localização...";
    navigator.geolocation.getCurrentPosition(
      (pos) => { div.querySelector("#eLat").value = pos.coords.latitude.toFixed(6); div.querySelector("#eLng").value = pos.coords.longitude.toFixed(6); btn.disabled=false; btn.textContent="📍 Usar minha localização atual"; },
      (err) => { alert("Não foi possível obter sua localização: " + err.message); btn.disabled=false; btn.textContent="📍 Usar minha localização atual"; },
      { enableHighAccuracy:true, timeout:15000 }
    );
  });
  div.querySelector("#mCancelar").addEventListener("click", () => div.remove());
  div.querySelector("#mSalvar").addEventListener("click", async () => {
    const dados = {

    else await db.collection("entidades").doc().set(dados);
    div.remove();
    await recarregarEntidades();
    renderEntidades();
  });
}

// 5c. GESTÃO DE ESCALAS (hub único: criar tipos de escala + montar cada escala)
// -------------------------------------------------------------------------
async function renderEscalasHub() {
  const vp = document.getElementById("viewport");
  vp.innerHTML = `<div class="cartao">Carregando...</div>`;
  await recarregarTiposEscala();
  await carregarEntidades();
  const lista = ESTADO.cacheTiposEscala;
  const podeGerenciarTipos = podeVerTela("tipos-escala");
  const hojeHub = new Date();
  const mesHub = hojeHub.getMonth()+1, anoHub = hojeHub.getFullYear();
  const resumoHub = {};
  for (const t of lista) {
    const lib = await statusLiberacao(t.id, anoHub, mesHub);
    const snap = await db.collection("escalas").where("setor","==",t.id).where("ano","==",anoHub).where("mes","==",mesHub).get();
    let qtd = 0, horas = 0; const mapa = {}; (t.codigos||[]).forEach(c => mapa[c.codigo] = c);
    snap.docs.forEach(d => Object.values(d.data().dias||{}).forEach(c => { qtd++; horas += (+mapa[c]?.horas||0); }));
    resumoHub[t.id] = { lib, qtd, horas };
  }

  vp.innerHTML = `
    <div class="cabecalho-pagina">
      <div><h2>Gestão de Escalas</h2><div class="desc">Crie os tipos de escala e monte cada uma delas a partir daqui.</div></div>
    </div>

    <div class="cartao cartao-destaque" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div>
        <h3 style="margin:0 0 4px">📆 Escala Semanal</h3>
        <div class="desc" style="margin:0">Todos os setores numa grade de 7 dias, com os cartões de cada plantonista, "+" para incluir, Replicar Semana e liberação da escala.</div>
      </div>
      <button class="btn btn-primario" id="btnAbrirSemanal" style="width:auto">Abrir Escala Semanal</button>
    </div>

    ${podeGerenciarTipos ? `
    <div class="cartao" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div>
        <h3 style="margin:0 0 4px">🗂️ Tipos de Escala</h3>
        <div class="desc" style="margin:0">Cadastre os tipos (Plantões, Enfermagem, Técnicos...), seus códigos, horários e cores.</div>
      </div>
      <button class="btn btn-primario" id="btnAbrirTiposEscala">Gerenciar Tipos de Escala</button>
    </div>` : ""}

    <h3 style="margin:20px 0 10px">🛠️ Montar Escala</h3>
    <div class="grade-cartoes">
      ${lista.map(t => `
        <div class="cartao">
          <h3 style="margin:0 0 2px">${escapeHtml(t.nome)}</h3>
          ${t.entidadeId ? `<div style="font-size:.78rem;color:#6b7280;margin-bottom:10px">🏢 ${escapeHtml(nomeEntidade(t.entidadeId))}</div>` : `<div style="margin-bottom:10px"></div>`}
          <div class="legenda-codigos" style="margin-bottom:12px">
            ${(t.codigos||[]).slice(0,6).map(c => `<span style="background:${c.cor};color:${corTexto(c.cor)}">${c.codigo}</span>`).join("")}
          </div>
          <div style="font-size:.78rem;color:#6b7280;margin-bottom:8px">${MESES[mesHub-1]}/${anoHub}: <b>${resumoHub[t.id].qtd}</b> plantão(ões) · <b>${resumoHub[t.id].horas}h</b><br>${chipLiberacao(resumoHub[t.id].lib, false)}</div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-primario btnMontarEscala" data-id="${t.id}" style="flex:1">Mensal</button>
            <button class="btn btn-secundario btnSemanalTipo" data-nome="${escapeHtml(t.nome)}" style="flex:1">Semanal</button>
          </div>
        </div>`).join("") || `<div class="cartao">Nenhum tipo de escala cadastrado ainda. ${podeGerenciarTipos ? 'Clique em "Gerenciar Tipos de Escala" acima para criar o primeiro.' : ""}</div>`}
    </div>`;

  document.getElementById("btnAbrirTiposEscala")?.addEventListener("click", () => { ESTADO.telaAtual = "tipos-escala"; renderApp(); });
  document.getElementById("btnAbrirSemanal").addEventListener("click", () => { ESTADO_SEMANAL.busca = ""; ESTADO.telaAtual = "escala-semanal"; renderApp(); });
  vp.querySelectorAll(".btnSemanalTipo").forEach(btn => btn.addEventListener("click", () => {
    ESTADO_SEMANAL.busca = btn.dataset.nome; ESTADO_SEMANAL.entidadeId = "";
    ESTADO.telaAtual = "escala-semanal"; renderApp();
  }));
  vp.querySelectorAll(".btnMontarEscala").forEach(btn => btn.addEventListener("click", () => {
    ESTADO.telaAtual = "escala-" + btn.dataset.id;
    renderApp();
  }));
}

function modalTipoEscala(tipo) {

  const div = document.createElement("div");
  div.className = "modal-fundo";

  function linhasCodigosHtml(codigos) {
    return codigos.map((c,i) => `

        <input class="cInicio" type="time" value="${c.inicio||"07:00"}" title="Horário de início" style="width:100px">
        <input class="cHoras" type="number" step="0.5" placeholder="Horas" value="${c.horas}" style="width:72px" title="Duração em horas">
        <input class="cCor" type="color" value="${c.cor||"#2c3e70"}">
        <button type="button" class="icone-acao btnRemoverLinha" title="Remover">🗑️</button>

  div.innerHTML = `
    <div class="modal" style="max-width:560px">
      <h3>${editando ? "Editar" : "Novo"} tipo de escala</h3>
      <div class="campo"><label>Nome da escala</label><input id="tNome" placeholder="Ex.: Escala - Enfermagem" value="${escapeHtml(t.nome)}"></div>
      <div class="campo"><label>Entidade / local</label>
        <select id="tEntidade">
          <option value="">— Não vinculado —</option>
          ${ESTADO.cacheEntidades.map(e=>`<option value="${e.id}" ${t.entidadeId===e.id?"selected":""}>${escapeHtml(e.nomeFantasia||e.razaoSocial)}</option>`).join("")}
        </select>
      </div>
      <label style="font-size:.8rem;font-weight:600;color:#374151">Códigos desta escala (código, nome, horário de início, duração em horas, cor)</label>
      <div id="areaLinhasCodigo" style="margin-top:6px;display:flex;flex-direction:column;gap:6px">${linhasCodigosHtml(t.codigos)}</div>
      <button type="button" class="btn btn-secundario" id="btnAddLinha" style="margin-top:10px">+ Adicionar código</button>
      <div class="acoes">
        <button class="btn btn-secundario" id="mCancelar">Cancelar</button>
        <button class="btn btn-primario" id="mSalvar">Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(div);

  function ligarRemocao() {
    div.querySelectorAll(".btnRemoverLinha").forEach(b => b.addEventListener("click", () => {
      const linha = b.closest(".linha-codigo");
      if (div.querySelectorAll(".linha-codigo").length <= 1) { alert("Mantenha pelo menos um código."); return; }
      linha.remove();
    }));
  }
  ligarRemocao();

  div.querySelector("#btnAddLinha").addEventListener("click", () => {
    const area = div.querySelector("#areaLinhasCodigo");
    const cor = PALETA_CORES[area.children.length % PALETA_CORES.length];
    area.insertAdjacentHTML("beforeend", linhasCodigosHtml([{codigo:"",nome:"",horas:12,inicio:"07:00",cor}]));
    ligarRemocao();
  });

  div.querySelector("#mCancelar").addEventListener("click", () => div.remove());
  div.querySelector("#mSalvar").addEventListener("click", async () => {
    const nome = div.querySelector("#tNome").value.trim();
    if (!nome) { alert("Informe o nome da escala."); return; }
    const entidadeId = div.querySelector("#tEntidade").value;
    const codigos = [...div.querySelectorAll(".linha-codigo")].map(linha => ({
      codigo: linha.querySelector(".cCodigo").value.trim().toUpperCase(),
      nome: linha.querySelector(".cNome").value.trim(),
      inicio: linha.querySelector(".cInicio").value || "07:00",
      horas: +linha.querySelector(".cHoras").value || 0,
      cor: linha.querySelector(".cCor").value,
    })).filter(c => c.codigo);
    if (!codigos.length) { alert("Adicione pelo menos um código válido."); return; }
    if (editando) await db.collection("tiposEscala").doc(t.id).update({ nome, entidadeId, codigos });
    else await db.collection("tiposEscala").doc().set({ nome, entidadeId, codigos, criadoEm: Date.now() });
    div.remove();
    await recarregarTiposEscala();
    renderApp();
    ESTADO.telaAtual = "tipos-escala";
    renderTiposEscala();
  });
}

// 8. COMPETÊNCIAS (períodos mensais — travar edição após o fechamento)
// -------------------------------------------------------------------------
function idCompetencia(ano, mes) { return `${ano}-${mes}`; }

async function statusCompetencia(ano, mes) {
  const snap = await db.collection("competencias").doc(idCompetencia(ano,mes)).get();
  return snap.exists ? snap.data().status : "aberta";
}

let ESTADO_COMPETENCIAS = { anoDe: new Date().getFullYear()-1, anoAte: new Date().getFullYear()+1 };

async function renderCompetencias() {
  const vp = document.getElementById("viewport");
  vp.innerHTML = `<div class="cartao">Carregando...</div>`;
  const hoje = new Date();
  const { anoDe, anoAte } = ESTADO_COMPETENCIAS;
  const periodos = [];
  for (let ano = anoDe; ano <= anoAte; ano++) {
    for (let mes = 1; mes <= 12; mes++) periodos.push({ ano, mes });
  }
  const snap = await db.collection("competencias").get();
  const fechadas = {}; snap.docs.forEach(d => fechadas[d.id] = d.data());
  const souAdmin = podeEditarTela("competencias");
  // Liberação das escalas por mês (documentos de controle "_liberacao_..." na coleção escalas)
  const liberadasPorMes = {};
  try {
    const lsnap = await db.collection("escalas").where("tipoDoc","==","liberacao").get();
    lsnap.docs.forEach(d => { const x = d.data(); if (x.liberada && ESTADO.cacheTiposEscala.some(t => t.id === x.liberacaoSetor)) { const k = idCompetencia(x.liberacaoAno, x.liberacaoMes); liberadasPorMes[k] = (liberadasPorMes[k]||0) + 1; } });
  } catch (e) { console.warn(e); }
  const totalTipos = ESTADO.cacheTiposEscala.length;
  const anosOpcoes = []; for (let a = hoje.getFullYear()-10; a <= hoje.getFullYear()+10; a++) anosOpcoes.push(a);

  vp.innerHTML = `
    <div class="cabecalho-pagina">
      <div><h2>Competências</h2><div class="desc">O sistema gera os meses automaticamente (não precisa criar nenhum) — todos ficam sempre disponíveis para consulta. Fechar uma competência apenas bloqueia novas edições na escala daquele mês, preservando o histórico para relatórios futuros.</div></div>
    </div>
    <div class="barra-ferramentas">
      <label style="font-size:.8rem">Mostrar de <select id="selAnoDe">${anosOpcoes.map(a=>`<option value="${a}" ${a===anoDe?"selected":""}>${a}</option>`).join("")}</select></label>
      <label style="font-size:.8rem">até <select id="selAnoAte">${anosOpcoes.map(a=>`<option value="${a}" ${a===anoAte?"selected":""}>${a}</option>`).join("")}</select></label>
      <button class="btn btn-secundario" id="btnAtualizarAnos">Atualizar</button>
    </div>
    <div class="cartao" style="overflow:auto;max-height:70vh">
      <table class="tabela">
        <thead><tr><th>Competência</th><th>Status</th><th>Escalas liberadas</th>${souAdmin ? "<th></th>" : ""}</tr></thead>
        <tbody>
          ${periodos.slice().reverse().map(p => {
            const id = idCompetencia(p.ano,p.mes);
            const dado = fechadas[id];
            const fechada = dado && dado.status === "fechada";
            const nLib = liberadasPorMes[id] || 0;
            const ehAtual = p.ano === hoje.getFullYear() && p.mes === hoje.getMonth()+1;
            return `<tr data-id="${id}" data-ano="${p.ano}" data-mes="${p.mes}" ${ehAtual?'style="background:#fff7e0"':""}>
              <td>${MESES[p.mes-1]} de ${p.ano}${ehAtual?' <span class="badge badge-azul">mês atual</span>':""}</td>
              <td>${fechada ? `<span class="badge badge-vermelho">🔒 Fechada</span>` : `<span class="badge badge-verde">Aberta</span>`}</td>
              <td>${nLib ? `<span class="badge ${nLib>=totalTipos?"badge-verde":"badge-amarelo"}">✅ ${nLib} de ${totalTipos}</span>` : `<span class="badge badge-cinza">—</span>`}</td>
              ${souAdmin ? `<td><button class="btn ${fechada?"btn-sucesso":"btn-perigo"} btnToggleComp" style="padding:6px 10px">${fechada?"Reabrir":"Fechar"}</button></td>` : ""}
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`;

  document.getElementById("btnAtualizarAnos").addEventListener("click", () => {
    ESTADO_COMPETENCIAS.anoDe = +document.getElementById("selAnoDe").value;
    ESTADO_COMPETENCIAS.anoAte = +document.getElementById("selAnoAte").value;
    if (ESTADO_COMPETENCIAS.anoDe > ESTADO_COMPETENCIAS.anoAte) { alert('O ano "de" precisa ser menor ou igual ao "até".'); return; }
    renderCompetencias();
  });

  if (souAdmin) {
    vp.querySelectorAll(".btnToggleComp").forEach(btn => btn.addEventListener("click", async () => {
      const tr = btn.closest("tr");
      const id = tr.dataset.id, ano = +tr.dataset.ano, mes = +tr.dataset.mes;
      const atual = await db.collection("competencias").doc(id).get();
      const fechadaAgora = atual.exists && atual.data().status === "fechada";
      if (fechadaAgora) {
        await db.collection("competencias").doc(id).set({ ano, mes, status:"aberta" });
      } else {
        if (!confirm(`Fechar a competência de ${MESES[mes-1]}/${ano}? Ninguém mais poderá editar as escalas desse mês até você reabrir.`)) return;
        await db.collection("competencias").doc(id).set({ ano, mes, status:"fechada", fechadaEm: Date.now(), fechadaPor: ESTADO.usuarioDoc.nome });
      }
      renderCompetencias();
    }));
  }
}

// 9. ESCALA (grade mensal por tipo de escala, dinâmico)
// -------------------------------------------------------------------------
function diasNoMes(ano, mes) { return new Date(ano, mes, 0).getDate(); }
function diaDaSemana(ano, mes, dia) { return new Date(ano, mes-1, dia).getDay(); }

async function renderEscala(setorId) {
  const tipo = ESTADO.cacheTiposEscala.find(t => t.id === setorId);
  const vp = document.getElementById("viewport");
  if (!tipo) { vp.innerHTML = `<div class="cartao">Este tipo de escala não existe mais.</div>`; return; }

  ESTADO.escalaAtual.setorId = setorId;
  const { mes, ano } = ESTADO.escalaAtual;
  vp.innerHTML = `<div class="cartao">Carregando escala...</div>`;

  let profissionais = (await carregarProfissionais()).filter(p => p.ativo !== false);
  const temListaParticipantes = Array.isArray(tipo.participantes);
  if (temListaParticipantes) profissionais = profissionais.filter(p => tipo.participantes.includes(p.id));
  const totalDias = diasNoMes(ano, mes);
  const codigos = tipo.codigos || [];
  const mapaCodigos = {}; codigos.forEach(c => mapaCodigos[c.codigo] = c);
  const statusComp = await statusCompetencia(ano, mes);
  const fechada = statusComp === "fechada";
  const podeEditar = podeEditarTela("escalas") && !fechada;
  const podeGerenciarParticipantes = podeEditarTela("escalas");

  const snap = await db.collection("escalas").where("setor","==",setorId).where("ano","==",ano).where("mes","==",mes).get();
  const escalasPorProf = {};
  snap.docs.forEach(d => { escalasPorProf[d.data().profissionalId] = { id:d.id, ...d.data() }; });

  const anosOpcoes = []; for (let a = Math.min(ano, new Date().getFullYear()-2); a <= Math.max(ano, new Date().getFullYear()+2); a++) anosOpcoes.push(a);
  const liberacao = await statusLiberacao(setorId, ano, mes, true);
  const hojeGrade = new Date();
  const diaHoje = (hojeGrade.getFullYear() === ano && hojeGrade.getMonth()+1 === mes) ? hojeGrade.getDate() : 0;
  const plantonistasPorDia = Array(totalDias+1).fill(0);
  Object.values(escalasPorProf).forEach(doc => Object.entries(doc.dias||{}).forEach(([d,c]) => { if (c && +d <= totalDias && (+mapaCodigos[c]?.horas||0) > 0) plantonistasPorDia[+d]++; }));

  vp.innerHTML = `
    <div class="cabecalho-pagina">
      <div><button class="link-alt" style="margin:0 0 4px;text-align:left" id="btnVoltarHubEscala">← Voltar para Gestão de Escalas</button><h2>${escapeHtml(tipo.nome)}</h2><div class="desc">${tipo.entidadeId?`🏢 ${escapeHtml(nomeEntidade(tipo.entidadeId))} — `:""}${fechada ? "🔒 Competência fechada — somente leitura." : (podeEditar ? "Clique numa célula para alterar o código do plantão." : "Modo somente leitura.")}</div></div>
    </div>
    <div class="barra-ferramentas">
      <button class="btn btn-secundario" id="btnMesAntEscala" title="Mês anterior" style="padding:8px 12px">‹</button>
      <select id="selMes">${MESES.map((m,i)=>`<option value="${i+1}" ${i+1===mes?"selected":""}>${m}</option>`).join("")}</select>
      <select id="selAno">${anosOpcoes.map(a=>`<option value="${a}" ${a===ano?"selected":""}>${a}</option>`).join("")}</select>
      <button class="btn btn-secundario" id="btnMesProxEscala" title="Próximo mês" style="padding:8px 12px">›</button>
      <button class="btn btn-secundario" id="btnVerSemanal">📆 Ver semanal</button>
      <button class="btn btn-secundario" id="btnImprimirEscala">🖨️ Imprimir</button>
      ${podeGerenciarParticipantes ? `<button class="btn btn-secundario" id="btnParticipantes">👥 Profissionais desta escala (${profissionais.length})</button>` : ""}
      <input type="search" id="filtroProfEscala" placeholder="🔎 Filtrar profissional..." style="min-width:180px">
      ${chipLiberacao(liberacao, podeEditar, 'id="btnLiberarMensal"')}
      ${fechada ? `<span class="badge badge-vermelho">🔒 Competência fechada</span>` : ""}
    </div>
    ${temListaParticipantes && profissionais.length === 0 ? `<div class="cartao"><p style="margin:0">Nenhum profissional foi selecionado para esta escala ainda. Clique em "👥 Profissionais desta escala" para escolher quem participa.</p></div>` : ""}
    <div class="cartao">
      <div class="wrapper-escala">
        <table class="escala" id="tabelaEscala">
          <thead>
            <tr>
              <th class="col-nome">Profissional</th>
              ${Array.from({length:totalDias},(_,i)=>{
                const d=i+1; const dsem=diaDaSemana(ano,mes,d); const fds = dsem===0||dsem===6;
                return `<th class="${fds?'fds':''} ${d===diaHoje?'col-hoje':''}">${d}<br><small>${DIAS_SEMANA[dsem]}</small></th>`;
              }).join("")}
              <th>Total horas</th>
            </tr>
          </thead>
          <tbody>
            ${profissionais.map(p => {
              const doc = escalasPorProf[p.id] || { dias:{} };
              const horas = calcularHorasProfissional(doc.dias, mapaCodigos);
              const ehMeuProfissional = p.id === ESTADO.usuarioDoc.profissionalId;
              return `<tr data-prof="${p.id}" data-nome="${escapeHtml((p.nome||"").toLowerCase())}">
                <td class="nome-prof">${escapeHtml(p.nome)}${p.crm?`<br><small style="font-weight:400;color:#6b7280">CRM ${escapeHtml(p.crm)}${p.ufCrm?"/"+escapeHtml(p.ufCrm):""}</small>`:""}</td>
                ${Array.from({length:totalDias},(_,i)=>{
                  const d=i+1; const cod = doc.dias[d] || "";
                  const dsem=diaDaSemana(ano,mes,d); const fds = dsem===0||dsem===6;
                  const corBg = cod && mapaCodigos[cod] ? mapaCodigos[cod].cor : "";
                  const corTxt = cod && mapaCodigos[cod] ? corTexto(corBg) : "";
                  const podeTrocarCelula = ehMeuProfissional && cod && !fechada && podeVerTela("trocas");
                  let titulo = "";
                  if (cod && mapaCodigos[cod]) {
                    const periodo = periodoDoTurno(ano, mes, d, mapaCodigos[cod]);
                    titulo = `${mapaCodigos[cod].nome} — ${periodo.inicioTexto} até ${periodo.fimTexto}`;
                    if (podeTrocarCelula) titulo += " (clique para solicitar troca)";
                  }
                  return `<td class="dia ${fds?'fds':''} ${d===diaHoje?'col-hoje':''} ${podeTrocarCelula?'dia-minha':''}" data-dia="${d}" style="${cod?`background:${corBg};color:${corTxt};`:''}" title="${titulo}">${cod}</td>`;
                }).join("")}
                <td class="total-linha">${horas}h</td>
              </tr>`;
            }).join("")}
          </tbody>
          <tfoot>
            <tr class="linha-cobertura">
              <td class="nome-prof" title="Quantos profissionais estão escalados em cada dia (códigos com horas)">Plantonistas no dia</td>
              ${Array.from({length:totalDias},(_,i)=>`<td class="${plantonistasPorDia[i+1]===0?'cob-zero':''} ${i+1===diaHoje?'col-hoje':''}" data-cobdia="${i+1}">${plantonistasPorDia[i+1]}</td>`).join("")}
              <td class="total-linha" id="totalGeralEscala"></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="legenda-codigos">
        ${codigos.map(c => `<span style="background:${c.cor};color:${corTexto(c.cor)}">${c.codigo} — ${c.nome}</span>`).join("")}
      </div>
    </div>`;

  document.getElementById("btnVoltarHubEscala").addEventListener("click", () => { ESTADO.telaAtual = "escalas-hub"; renderApp(); });
  document.getElementById("selMes").addEventListener("change", e => { ESTADO.escalaAtual.mes = +e.target.value; renderEscala(setorId); });
  document.getElementById("selAno").addEventListener("change", e => { ESTADO.escalaAtual.ano = +e.target.value; renderEscala(setorId); });
  document.getElementById("btnImprimirEscala").addEventListener("click", () => window.print());
  document.getElementById("btnParticipantes")?.addEventListener("click", () => modalParticipantesEscala(tipo));
  const irParaMes = (delta) => {
    let m = mes + delta, a = ano;
    if (m < 1) { m = 12; a--; } if (m > 12) { m = 1; a++; }
    ESTADO.escalaAtual.mes = m; ESTADO.escalaAtual.ano = a; renderEscala(setorId);
  };
  document.getElementById("btnMesAntEscala").addEventListener("click", () => irParaMes(-1));
  document.getElementById("btnMesProxEscala").addEventListener("click", () => irParaMes(1));
  document.getElementById("btnVerSemanal").addEventListener("click", () => {
    const ref = diaHoje ? new Date(ano, mes-1, diaHoje) : new Date(ano, mes-1, 1);
    ESTADO_SEMANAL.inicio = inicioDaSemana(ref); ESTADO_SEMANAL.busca = tipo.nome; ESTADO_SEMANAL.entidadeId = "";
    ESTADO.telaAtual = "escala-semanal"; renderApp();
  });
  const btnLib = document.getElementById("btnLiberarMensal");
  if (btnLib && btnLib.tagName === "BUTTON") btnLib.addEventListener("click", async () => { if (await alternarLiberacao(setorId, ano, mes)) renderEscala(setorId); });
  document.getElementById("filtroProfEscala").addEventListener("input", e => {
    const t = e.target.value.trim().toLowerCase();
    vp.querySelectorAll("#tabelaEscala tbody tr").forEach(tr => { tr.style.display = (!t || tr.dataset.nome.includes(t)) ? "" : "none"; });
  });
  const atualizarTotaisRodape = () => {
    let geral = 0;
    vp.querySelectorAll("#tabelaEscala tbody tr").forEach(tr => { geral += parseFloat(tr.querySelector(".total-linha").textContent) || 0; });
    const tg = document.getElementById("totalGeralEscala"); if (tg) tg.textContent = geral + "h";
    for (let d = 1; d <= totalDias; d++) {
      let n = 0;
      vp.querySelectorAll(`#tabelaEscala tbody td.dia[data-dia="${d}"]`).forEach(td => { const c = td.textContent.trim(); if (c && (+mapaCodigos[c]?.horas||0) > 0) n++; });
      const cel = vp.querySelector(`td[data-cobdia="${d}"]`); if (cel) { cel.textContent = n; cel.classList.toggle("cob-zero", n === 0); }
    }
  };
  atualizarTotaisRodape();

  if (podeEditar) {
    vp.querySelectorAll("td.dia").forEach(td => td.addEventListener("click", async () => {
      const tr = td.closest("tr");
      const profId = tr.dataset.prof;
      const dia = td.dataset.dia;
      const atual = td.textContent.trim();
      const opcoes = ["", ...codigos.map(c=>c.codigo)];
      const prox = opcoes[(opcoes.indexOf(atual)+1) % opcoes.length];
      td.textContent = prox;
      if (prox && mapaCodigos[prox]) {
        td.style.background = mapaCodigos[prox].cor;
        td.style.color = corTexto(mapaCodigos[prox].cor);
        td.title = mapaCodigos[prox].nome;
      } else {
        td.style.background = ""; td.style.color = ""; td.title = "";
      }
      await salvarCelulaEscala(setorId, ano, mes, profId, dia, prox);
      const dias = {}; tr.querySelectorAll("td.dia").forEach(c => { if (c.textContent.trim()) dias[c.dataset.dia] = c.textContent.trim(); });
      tr.querySelector(".total-linha").textContent = calcularHorasProfissional(dias, mapaCodigos) + "h";
      atualizarTotaisRodape();
    }));
  } else {
    vp.querySelectorAll("td.dia-minha").forEach(td => td.addEventListener("click", () => {
      const dia = +td.dataset.dia;
      const codigo = td.textContent.trim();
      modalSolicitarTroca(tipo, profissionais.find(p=>p.id===ESTADO.usuarioDoc.profissionalId), dia, codigo, ano, mes, mapaCodigos, profissionais);
    }));
  }
}

// 9b. TROCAS DE PLANTÃO
// -------------------------------------------------------------------------
// Fluxo: 1) profissional solicita troca de um plantão seu com um colega  ->
// 2) o colega recebe e-mail/notificação e CONFIRMA ou RECUSA -> 3) se confirmar,
// o Administrador e/ou Diretor Clínico da entidade recebem e-mail/notificação
// para AUTORIZAR -> 4) ao autorizar, o sistema troca as células na escala
// automaticamente.

async function buscarDestinatariosAprovacao(entidadeId) {
  const snap = await db.collection("usuarios").where("ativo","==",true).get();
  return snap.docs.map(d=>d.data())
    .filter(u => (u.perfil === "administrador" || u.perfil === "diretor_clinico"))
    .filter(u => !u.entidadeId || u.entidadeId === entidadeId)
    .filter(u => u.email);
}

function gerarToken() {
  if (window.crypto?.randomUUID) return crypto.randomUUID().replace(/-/g,"");
  return Array.from({length:32}, () => Math.floor(Math.random()*16).toString(16)).join("");
}

function urlBaseApp() { return window.location.origin + window.location.pathname; }

function primeiroNome(nomeCompleto) { return (nomeCompleto||"").trim().split(" ")[0]; }

// ---- Ações compartilhadas (chamadas tanto pelo botão dentro do sistema quanto pelo link do e-mail) ----
async function notificarConfirmacaoDestino(troca) {
  const destinatarios = await buscarDestinatariosAprovacao(troca.entidadeId);
  for (const dest of destinatarios) await enviarEmail(dest.email, `Nova troca de plantão — ${troca.profissionalOrigemNome} / ${troca.profissionalDestinoNome}`, montarCorpoEmailNovaTrocaAdmin(troca));
  await enviarEmail(troca.profissionalOrigemEmail, "Sua troca de plantão foi confirmada pelo colega", montarCorpoEmailAvisoOrigem(troca, true));
}
async function notificarRecusaDestino(troca) {
  await enviarEmail(troca.profissionalOrigemEmail, "Sua troca de plantão não foi aceita", montarCorpoEmailAvisoOrigem(troca, false));
}

function modalSolicitarTroca(tipo, profOrigem, dia, codigo, ano, mes, mapaCodigos, todosProfissionais) {
  if (!profOrigem) { alert("Seu usuário não está vinculado a um profissional. Peça a um Administrador para vincular seu login em \"Usuários e Perfis\"."); return; }
  const infoCodigo = mapaCodigos[codigo];
  const periodo = periodoDoTurno(ano, mes, dia, infoCodigo);
  const outros = todosProfissionais.filter(p => p.id !== profOrigem.id);
  const entidade = tipo.entidadeId ? ESTADO.cacheEntidades.find(e=>e.id===tipo.entidadeId) : null;

  const div = document.createElement("div");
  div.className = "modal-fundo";
  div.innerHTML = `
    <div class="modal">
      <h3>🔄 Solicitar troca de plantão</h3>
      <p style="font-size:.85rem;background:var(--azul-cl);padding:10px 12px;border-radius:8px">
        <b>${escapeHtml(tipo.nome)}</b>${entidade?` — ${escapeHtml(entidade.nomeFantasia||entidade.razaoSocial)}`:""}<br>
        Dia ${fmtData2(dia)}/${fmtData2(mes)}/${ano} — ${escapeHtml(infoCodigo?.nome||codigo)} (${codigo})<br>
        De ${periodo.inicioTexto} até ${periodo.fimTexto}
      </p>
      <div class="campo"><label>Trocar com qual profissional?</label>
        <select id="tcDestino">
          <option value="">Selecione...</option>
          ${outros.map(p=>`<option value="${p.id}">${escapeHtml(p.nome)}</option>`).join("")}
        </select>
      </div>
      <div class="campo"><label>Motivo da troca *</label><textarea id="tcMotivo" rows="3" placeholder="Explique o motivo da solicitação"></textarea></div>
      <p style="font-size:.78rem;color:#6b7280">O colega escolhido recebe um e-mail para confirmar (SIM/NÃO), direto pelo próprio e-mail. Depois de confirmado, o Administrador e/ou Diretor Clínico precisam autorizar para a troca valer de fato na escala.</p>
      <div id="areaMsgTroca"></div>
      <div class="acoes">
        <button class="btn btn-secundario" id="mCancelar">Cancelar</button>
        <button class="btn btn-primario" id="mSalvar">Enviar solicitação</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  div.querySelector("#mCancelar").addEventListener("click", () => div.remove());
  div.querySelector("#mSalvar").addEventListener("click", async () => {
    const destinoId = div.querySelector("#tcDestino").value;
    const motivo = div.querySelector("#tcMotivo").value.trim();
    if (!destinoId) { alert("Selecione o profissional para a troca."); return; }
    if (!motivo) { alert("Informe o motivo da troca."); return; }
    const profDestino = todosProfissionais.find(p=>p.id===destinoId);
    const btn = div.querySelector("#mSalvar"); btn.disabled = true; btn.textContent = "Enviando...";

    // Guarda tudo já "pronto" no próprio documento (nome, entidade, horários) para que o
    // e-mail e o link de confirmação funcionem mesmo sem o colega estar logado no sistema.
    const troca = {
      setorId: tipo.id, setorNome: tipo.nome, entidadeId: tipo.entidadeId||"",
      entidadeNome: entidade ? (entidade.nomeFantasia||entidade.razaoSocial) : "",
      entidadeNomeFantasia: entidade?.nomeFantasia || "",
      entidadeRazaoSocial: entidade?.razaoSocial || "",
      ano, mes, dia, codigo, codigoNome: infoCodigo?.nome||codigo,
      periodoInicioTexto: periodo.inicioTexto, periodoFimTexto: periodo.fimTexto,
      profissionalOrigemId: profOrigem.id, profissionalOrigemNome: profOrigem.nome, profissionalOrigemEmail: profOrigem.email||"",
      profissionalDestinoId: profDestino.id, profissionalDestinoNome: profDestino.nome, profissionalDestinoEmail: profDestino.email||"",
      motivo, status:"aguardando_destino",
      tokenDestino: gerarToken(),
      solicitadoPor: ESTADO.usuarioDoc.nome, solicitadoEm: Date.now(),
    };
    const ref = await db.collection("trocas").add(troca);
    troca.id = ref.id;

    if (troca.profissionalDestinoEmail) {
      await enviarEmail(troca.profissionalDestinoEmail, `Troca de Plantão — ${troca.profissionalOrigemNome} e ${troca.profissionalDestinoNome}`, montarCorpoEmailConfirmacaoDestino(troca));
    }

    div.remove();
    alert("Solicitação enviada! O colega vai receber um e-mail para confirmar (SIM/NÃO). Depois disso, o Administrador/Diretor Clínico serão avisados para autorizar.");
    renderTrocas();
  });
}

async function confirmarDestino(troca, aceitar) {
  if (!aceitar) {
    await db.collection("trocas").doc(troca.id).update({ status:"recusada_destino", respostaDestinoEm: Date.now() });
    await notificarRecusaDestino(troca);
    renderTrocas();
    return;
  }
  await db.collection("trocas").doc(troca.id).update({ status:"aguardando_aprovacao", respostaDestinoEm: Date.now() });
  await notificarConfirmacaoDestino(troca);
  renderTrocas();
}

async function decidirAprovacao(troca, autorizar) {
  if (!autorizar) {
    const motivoRecusa = prompt("Motivo da recusa (opcional):") || "";
    await db.collection("trocas").doc(troca.id).update({ status:"recusada_aprovacao", motivoRecusa, decididoPor: ESTADO.usuarioDoc.nome, decididoEm: Date.now() });
    troca.motivoRecusa = motivoRecusa;
    await enviarEmail(troca.profissionalOrigemEmail, "Troca de plantão negada", montarCorpoEmailResultadoFinal(troca, false));
    await enviarEmail(troca.profissionalDestinoEmail, "Troca de plantão negada", montarCorpoEmailResultadoFinal(troca, false));
    renderTrocas();
    return;
  }
  // Executa a troca de fato na escala: remove o código do profissional de origem e atribui ao destino
  const docIdOrigem = `${troca.setorId}_${troca.ano}_${troca.mes}_${troca.profissionalOrigemId}`;
  const docIdDestino = `${troca.setorId}_${troca.ano}_${troca.mes}_${troca.profissionalDestinoId}`;
  await db.collection("escalas").doc(docIdOrigem).set({ setor:troca.setorId, ano:troca.ano, mes:troca.mes, profissionalId:troca.profissionalOrigemId }, { merge:true });
  await db.collection("escalas").doc(docIdOrigem).update({ [`dias.${troca.dia}`]: firebase.firestore.FieldValue.delete() }).catch(()=>{});
  await db.collection("escalas").doc(docIdDestino).set({ setor:troca.setorId, ano:troca.ano, mes:troca.mes, profissionalId:troca.profissionalDestinoId }, { merge:true });
  await db.collection("escalas").doc(docIdDestino).set({ [`dias.${troca.dia}`]: troca.codigo }, { merge:true });
  await db.collection("historicoEscala").add({
    setorId: troca.setorId, setorNome: troca.setorNome, ano:troca.ano, mes:troca.mes, dia:troca.dia, codigo:troca.codigo,
    profissionalPrevistoId: troca.profissionalOrigemId, profissionalPrevistoNome: troca.profissionalOrigemNome,
    profissionalRealizadoId: troca.profissionalDestinoId, profissionalRealizadoNome: troca.profissionalDestinoNome,
    trocaId: troca.id, registradoEm: Date.now(),
  });

  await db.collection("trocas").doc(troca.id).update({ status:"aprovada", decididoPor: ESTADO.usuarioDoc.nome, decididoEm: Date.now() });
  await enviarEmail(troca.profissionalOrigemEmail, "Troca de plantão autorizada", montarCorpoEmailResultadoFinal(troca, true));
  await enviarEmail(troca.profissionalDestinoEmail, "Troca de plantão autorizada", montarCorpoEmailResultadoFinal(troca, true));
  renderTrocas();
}

async function processarLinkConfirmacaoTroca() {
  $app.innerHTML = `<div class="tela-login"><div class="cartao-login"><h1>⏳ Processando...</h1><div class="sub">Só um instante.</div></div></div>`;
  const { id, token, resposta } = LINK_TROCA;
  if (!id || !token || (resposta !== "sim" && resposta !== "nao")) {
    mostrarResultadoLink("Link inválido", "Este link de confirmação de troca de plantão está incompleto ou incorreto.", false); return;
  }
  try {
    const ref = db.collection("trocas").doc(id);
    const snap = await ref.get();
    if (!snap.exists) { mostrarResultadoLink("Solicitação não encontrada", "Esta solicitação de troca não existe mais.", false); return; }
    const troca = { id, ...snap.data() };
    if (troca.status !== "aguardando_destino") {
      mostrarResultadoLink("Já respondido", "Esta solicitação já foi respondida anteriormente (ou não está mais pendente). Nenhuma ação foi necessária agora.", true); return;
    }
    if (troca.tokenDestino !== token) { mostrarResultadoLink("Link inválido", "O código de confirmação deste link não confere.", false); return; }

    if (resposta === "sim") {
      await ref.update({ status:"aguardando_aprovacao", respostaDestinoEm: Date.now(), tokenUsado: token });
      await notificarConfirmacaoDestino(troca);
      mostrarResultadoLink("Troca confirmada!", `Você confirmou que assume o plantão de ${troca.setorNome} do dia ${fmtData2(troca.dia)}/${fmtData2(troca.mes)}/${troca.ano}. O Administrador/Diretor Clínico foram avisados para autorizar a troca.`, true);
    } else {
      await ref.update({ status:"recusada_destino", respostaDestinoEm: Date.now(), tokenUsado: token });
      await notificarRecusaDestino(troca);
      mostrarResultadoLink("Troca recusada", "Você recusou a troca de plantão. O profissional solicitante foi avisado e pode tentar com outro colega.", true);
    }
  } catch (err) {
    mostrarResultadoLink("Não foi possível processar", "Ocorreu um erro ao registrar sua resposta: " + err.message, false);
  }
}

function calcularHorasProfissional(diasObj, mapaCodigos) {
  let total = 0;
  Object.values(diasObj || {}).forEach(cod => { total += (mapaCodigos[cod]?.horas || 0); });
  return total;
}

async function salvarCelulaEscala(setor, ano, mes, profissionalId, dia, codigo) {
  const docId = `${setor}_${ano}_${mes}_${profissionalId}`;
  const ref = db.collection("escalas").doc(docId);
  const campo = `dias.${dia}`;
  if (codigo) {
    await ref.set({ setor, ano, mes, profissionalId }, { merge:true });
    await ref.set({ [campo]: codigo }, { merge:true });
  } else {
    await ref.set({ setor, ano, mes, profissionalId }, { merge:true });
    await ref.update({ [campo]: firebase.firestore.FieldValue.delete() }).catch(()=>{});
  }
}
