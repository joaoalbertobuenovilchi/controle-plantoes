async function montarDashboard(setorId, mes, ano) {
  const area = document.getElementById("areaDash");
  if (!setorId) { area.innerHTML = `<div class="cartao">Crie um tipo de escala primeiro.</div>`; return; }
  area.innerHTML = `<div class="cartao">Carregando...</div>`;
  const tipo = ESTADO.cacheTiposEscala.find(t=>t.id===setorId);
  const mapaCodigos = {}; (tipo.codigos||[]).forEach(c => mapaCodigos[c.codigo]=c);
  const profissionais = await carregarProfissionais();
  const snap = await db.collection("escalas").where("setor","==",setorId).where("ano","==",ano).where("mes","==",mes).get();
  const escalas = snap.docs.map(d => d.data());

  let totalHoras = 0, valorEstimado = 0;
  const porProfissional = {}; const porCodigo = {};
  escalas.forEach(doc => {
    const prof = profissionais.find(p=>p.id===doc.profissionalId);
    const nome = prof?.nome || "?";
    const categoria = prof?.categoria || "Médico";
    const valorHora = buscarValorHora(setorId, categoria);
    Object.values(doc.dias || {}).forEach(cod => {
      const h = mapaCodigos[cod]?.horas || 0;
      totalHoras += h;
      valorEstimado += h * valorHora;
      porProfissional[nome] = (porProfissional[nome]||0) + h;
      porCodigo[cod] = (porCodigo[cod]||0) + 1;
    });
  });

  const liberacao = await statusLiberacao(setorId, ano, mes, true);
  const compStatus = await statusCompetencia(ano, mes);
  // dias do mês sem nenhum plantonista (cobertura)
  const diasCobertos = new Set();
  escalas.forEach(doc => Object.entries(doc.dias||{}).forEach(([d,c]) => { if ((+mapaCodigos[c]?.horas||0) > 0) diasCobertos.add(+d); }));
  const diasSemCobertura = diasNoMes(ano, mes) - diasCobertos.size;
  let trocasPendentes = 0;
  try {
    const tsnap = await db.collection("trocas").orderBy("solicitadoEm","desc").limit(200).get();
    trocasPendentes = tsnap.docs.filter(d => ["aguardando_destino","aguardando_aprovacao"].includes(d.data().status)).length;
  } catch (e) { /* sem permissão */ }

  area.innerHTML = `
    <div class="grade-cartoes">
      <div class="kpi"><div class="valor">${profissionais.filter(p=>p.ativo!==false).length}</div><div class="rotulo">Profissionais ativos</div></div>
      <div class="kpi k-verde"><div class="valor">${totalHoras}h</div><div class="rotulo">Total de horas no mês</div></div>
      <div class="kpi k-amarelo"><div class="valor">${Object.keys(porProfissional).length}</div><div class="rotulo">Profissionais escalados</div></div>
      <div class="kpi k-vermelho"><div class="valor">${fmtMoeda(valorEstimado)}</div><div class="rotulo">Valor estimado a pagar</div></div>
      <div class="kpi ${diasSemCobertura?"k-vermelho":"k-verde"}"><div class="valor">${diasSemCobertura}</div><div class="rotulo">Dias sem plantonista</div></div>
      <div class="kpi ${trocasPendentes?"k-amarelo":""}"><div class="valor">${trocasPendentes}</div><div class="rotulo">Trocas pendentes</div></div>
      <div class="kpi ${escalaEstaLiberada(liberacao)?"k-verde":"k-amarelo"}"><div class="valor" style="font-size:1.05rem;padding:6px 0">${escalaEstaLiberada(liberacao)?"✅ Liberada":"🚫 Não liberada"}</div><div class="rotulo">Situação da escala</div></div>
      <div class="kpi ${compStatus==="fechada"?"k-vermelho":"k-verde"}"><div class="valor" style="font-size:1.05rem;padding:6px 0">${compStatus==="fechada"?"🔒 Fechada":"Aberta"}</div><div class="rotulo">Competência</div></div>
    </div>
    <div class="grafico-grid">
      <div class="cartao"><h3>Horas por profissional</h3><canvas id="graf1"></canvas></div>
      <div class="cartao"><h3>Distribuição por código</h3><canvas id="graf2"></canvas></div>
    </div>
    <div class="cartao"><h3>Evolução de horas — últimos 6 meses</h3><canvas id="graf3" style="max-height:260px"></canvas></div>`;

  destruirGraficos();
  const nomesProf = Object.keys(porProfissional);
  graficosAtivos.push(new Chart(document.getElementById("graf1"), {
    type: "bar",
    data: { labels: nomesProf, datasets: [{ label:"Horas", data: nomesProf.map(n=>porProfissional[n]), backgroundColor:"#0b5394" }] },
    options: { responsive:true, plugins:{legend:{display:false}} }
  }));
  graficosAtivos.push(new Chart(document.getElementById("graf2"), {
    type: "doughnut",
    data: { labels: Object.keys(porCodigo).map(c=>`${c} - ${mapaCodigos[c]?.nome||c}`), datasets:[{ data:Object.values(porCodigo), backgroundColor: Object.keys(porCodigo).map(c=>mapaCodigos[c]?.cor||"#999") }] },
    options: { responsive:true }
  }));

  const meses6 = [];
  for (let i=5;i>=0;i--) { const d = new Date(ano, mes-1-i, 1); meses6.push({ mes:d.getMonth()+1, ano:d.getFullYear(), label:`${MESES[d.getMonth()].slice(0,3)}/${d.getFullYear()}` }); }
  const totaisMensais = [];
  for (const m of meses6) {
    const s = await db.collection("escalas").where("setor","==",setorId).where("ano","==",m.ano).where("mes","==",m.mes).get();
    let h = 0; s.docs.forEach(d => Object.values(d.data().dias||{}).forEach(c => h += (mapaCodigos[c]?.horas||0)));
    totaisMensais.push(h);
  }
  graficosAtivos.push(new Chart(document.getElementById("graf3"), {
    type: "line",
    data: { labels: meses6.map(m=>m.label), datasets:[{ label:"Horas totais", data: totaisMensais, borderColor:"#1e8e5a", backgroundColor:"rgba(30,142,90,.15)", fill:true, tension:.3 }] },
    options: { responsive:true }
  }));
}

async function montarCalendario() {
  const area = document.getElementById("areaCalendario");
  area.innerHTML = "Carregando...";
  const { mes, ano, setoresIds, somenteMeus } = ESTADO_CONSULTA;
  const meuProfId = ESTADO.usuarioDoc.profissionalId;
  const profissionais = await carregarProfissionais();
  const totalDias = diasNoMes(ano, mes);

  const porDia = {}; // { dia: [ {profNome, corBg, corTxt, texto, horario} ] }
  for (let d=1; d<=totalDias; d++) porDia[d] = [];

  const naoLiberadas = [];
  for (const setorId of (setoresIds.length ? setoresIds : ESTADO.cacheTiposEscala.map(t=>t.id))) {
    const tipo = ESTADO.cacheTiposEscala.find(t=>t.id===setorId);
    if (!tipo) continue;
    if (ESTADO_CONSULTA.entidadeId && tipo.entidadeId !== ESTADO_CONSULTA.entidadeId) continue;
    const liberada = escalaEstaLiberada(await statusLiberacao(setorId, ano, mes));
    if (!liberada) naoLiberadas.push(tipo.nome);
    const mapaCodigos = {}; (tipo.codigos||[]).forEach(c=>mapaCodigos[c.codigo]=c);
    const snap = await db.collection("escalas").where("setor","==",setorId).where("ano","==",ano).where("mes","==",mes).get();
    snap.docs.forEach(docSnap => {
      const doc = docSnap.data();
      if (somenteMeus && doc.profissionalId !== meuProfId) return;
      const prof = profissionais.find(p=>p.id===doc.profissionalId);
      Object.entries(doc.dias||{}).forEach(([dia,codigo]) => {
        const info = mapaCodigos[codigo]; if (!info) return;
        if (!porDia[+dia]) return;
        porDia[+dia].push({
          nome: prof?.nome || "?", setor: tipo.nome,
          cor: info.cor, corTxt: corTexto(info.cor),
          horario: +info.horas ? `${info.inicio||""}–${horaFimTurno(info)}` : "",
          ordem: minutosInicio(info), liberada, meu: doc.profissionalId === meuProfId,
          titulo: `${tipo.nome} · ${info.nome} (${codigo})${liberada ? "" : " · escala ainda não liberada"}`,
        });
      });
    });
  }
  Object.values(porDia).forEach(l => l.sort((a,b) => a.ordem - b.ordem || a.nome.localeCompare(b.nome)));
  const hojeCal = new Date();
  const diaHojeCal = (hojeCal.getFullYear()===ano && hojeCal.getMonth()+1===mes) ? hojeCal.getDate() : 0;

  // A semana do calendário começa na segunda-feira (cabeçalho Seg…Dom)
  const primeiroDiaSemana = (diaDaSemana(ano, mes, 1) + 6) % 7;
  let celulas = [];
  for (let i=0;i<primeiroDiaSemana;i++) celulas.push(null);
  for (let d=1; d<=totalDias; d++) celulas.push(d);
  while (celulas.length % 7 !== 0) celulas.push(null);
  const semanas = []; for (let i=0;i<celulas.length;i+=7) semanas.push(celulas.slice(i,i+7));

  area.innerHTML = `
    ${naoLiberadas.length ? `<div class="ps-aviso" style="margin:0 0 10px">⚠️ Escala(s) ainda <b>não liberada(s)</b> em ${MESES[mes-1]}/${ano}: ${naoLiberadas.map(escapeHtml).join(", ")} — podem mudar até a liberação (aparecem com borda tracejada).</div>` : ""}
    <table class="calendario-consulta">
      <thead><tr>${["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(d=>`<th>${d}</th>`).join("")}</tr></thead>
      <tbody>
        ${semanas.map(semana => `<tr>${semana.map(d => {
          if (!d) return `<td class="dia-vazio"></td>`;
          const entradas = porDia[d]||[];
          return `<td class="${d===diaHojeCal?"cal-hoje":""}"><div class="num-dia">${d}${d===diaHojeCal?" · hoje":""}</div>${entradas.map(e=>`
            <div class="entrada-cal ${e.liberada?"":"entrada-previa"} ${e.meu?"entrada-minha":""}" style="background:${e.cor};color:${e.corTxt}" title="${escapeHtml(e.titulo)}">
              ${escapeHtml(e.nome)}${e.horario?` <small>${e.horario}</small>`:""}
            </div>`).join("") || ""}</td>`;
        }).join("")}</tr>`).join("")}
      </tbody>
    </table>
    ${!Object.values(porDia).some(l=>l.length) ? `<p style="margin-top:10px;color:#6b7280">Nenhum plantão encontrado para os filtros selecionados.</p>` : ""}`;
}

// Busca todos os plantões (dias preenchidos) no período, cruzando meses, para os setores informados.
async function buscarPlantoesPeriodo(setorIds, dataInicioStr, dataFimStr) {
  const dataInicio = new Date(dataInicioStr+"T00:00:00");
  const dataFim = new Date(dataFimStr+"T23:59:59");
  const resultado = [];
  let cursor = new Date(dataInicio.getFullYear(), dataInicio.getMonth(), 1);
  while (cursor <= dataFim) {
    const ano = cursor.getFullYear(), mes = cursor.getMonth()+1;
    let query = db.collection("escalas").where("ano","==",ano).where("mes","==",mes);
    const snap = await query.get();
    snap.docs.forEach(d => {
      const doc = d.data();
      if (setorIds.length && !setorIds.includes(doc.setor)) return;
      Object.entries(doc.dias||{}).forEach(([dia,codigo]) => {
        const data = new Date(ano, mes-1, +dia);
        if (data >= dataInicio && data <= dataFim) {
          resultado.push({ setorId:doc.setor, ano, mes, dia:+dia, data, profissionalId:doc.profissionalId, codigo });
        }
      });
    });
    cursor.setMonth(cursor.getMonth()+1);
  }
  resultado.sort((a,b)=>a.data-b.data);
  return resultado;
}

function mapaCodigosDoSetor(setorId) {
  const tipo = ESTADO.cacheTiposEscala.find(t=>t.id===setorId);
  const mapa = {}; (tipo?.codigos||[]).forEach(c=>mapa[c.codigo]=c);
  return mapa;
}

// ---- 1) Afastamento / Faltas ----
async function relAfastamentosOuFaltas(ctx) {
  const nomeRel = ctx.tipoRel === "faltas" ? "Faltas" : "Afastamento";
  const snap = await db.collection("afastamentos").get();
  let linhas = snap.docs.map(d=>d.data())
    .filter(a => a.dataInicio <= ctx.dataFim && a.dataFim >= ctx.dataInicio)
    .filter(a => ctx.tipoRel === "faltas" ? a.tipo === "Falta" : true)
    .filter(a => !ctx.profFiltroId || a.profissionalId === ctx.profFiltroId);
  linhas.sort((a,b)=>a.dataInicio.localeCompare(b.dataInicio));
  montarTabelaRelatorio(ctx.area, nomeRel, ctx.dataInicio, ctx.dataFim,
    ["Profissional","Tipo","Início","Fim","Motivo"],
    linhas.map(a=>[a.profissionalNome, a.tipo, fmtDataBR(a.dataInicio), fmtDataBR(a.dataFim), a.motivo||"-"]));
}

async function relDadosBancarios(ctx) {

  montarTabelaRelatorio(ctx.area, "Dados Bancários", null, null,

}

// ---- 3) Escalas (listagem cronológica, igual à grade) ----
async function relEscalas(ctx) {
  const plantoes = await buscarPlantoesPeriodo(ctx.setorIds, ctx.dataInicio, ctx.dataFim);
  const filtrados = plantoes.filter(p => !ctx.profFiltroId || p.profissionalId === ctx.profFiltroId);
  const linhas = filtrados.map(p => {
    const prof = ctx.profissionais.find(x=>x.id===p.profissionalId);
    const info = mapaCodigosDoSetor(p.setorId)[p.codigo];
    return [fmtData2(p.dia)+"/"+fmtData2(p.mes)+"/"+p.ano, DIAS_SEMANA[p.data.getDay()], ctx.nomeSetorFn(p.setorId), prof?.nome||"?", p.codigo, info?.nome||"-", info?.inicio||"-", (info?.horas||0)+"h"];
  });
  montarTabelaRelatorio(ctx.area, "Escalas", ctx.dataInicio, ctx.dataFim,
    ["Data","Dia","Escala","Profissional","Código","Turno","Início","Duração"], linhas);
}

// ---- Cobertura da escala: para cada dia e setor, quantos plantonistas e quem são (dias vazios aparecem como "SEM PLANTONISTA") ----
async function relCobertura(ctx) {
  const plantoes = await buscarPlantoesPeriodo(ctx.setorIds, ctx.dataInicio, ctx.dataFim);
  const [a1,m1,d1] = ctx.dataInicio.split("-").map(Number), [a2,m2,d2] = ctx.dataFim.split("-").map(Number);
  const ini = new Date(a1,m1-1,d1), fim = new Date(a2,m2-1,d2);
  const linhas = []; let vazios = 0;
  for (let dt = new Date(ini); dt <= fim; dt.setDate(dt.getDate()+1)) {
    for (const setorId of ctx.setorIds) {
      const mapa = mapaCodigosDoSetor(setorId);
      const doDia = plantoes.filter(p => p.setorId === setorId && p.ano === dt.getFullYear() && p.mes === dt.getMonth()+1 && p.dia === dt.getDate() && (+mapa[p.codigo]?.horas||0) > 0)
        .filter(p => !ctx.profFiltroId || p.profissionalId === ctx.profFiltroId)
        .sort((a,b) => minutosInicio(mapa[a.codigo]) - minutosInicio(mapa[b.codigo]));
      const horas = doDia.reduce((s,p) => s + (+mapa[p.codigo]?.horas||0), 0);
      if (!doDia.length) vazios++;
      linhas.push([`${fmtData2(dt.getDate())}/${fmtData2(dt.getMonth()+1)}/${dt.getFullYear()}`, DIAS_SEMANA[dt.getDay()], ctx.nomeSetorFn(setorId), String(doDia.length), horas+"h",
        doDia.length ? doDia.map(p => `${ctx.profissionais.find(x=>x.id===p.profissionalId)?.nome||"?"} (${p.codigo} ${mapa[p.codigo]?.inicio||""}–${horaFimTurno(mapa[p.codigo])})`).join("; ") : "SEM PLANTONISTA"]);
    }
  }
  montarTabelaRelatorio(ctx.area, "Cobertura da Escala", ctx.dataInicio, ctx.dataFim,
    ["Data","Dia","Escala","Plantonistas","Horas","Quem"], linhas, ["","","Dias/setores sem plantonista:", String(vazios), "", ""]);
  ctx.area.querySelectorAll("tbody tr").forEach(tr => { if (tr.lastElementChild?.textContent === "SEM PLANTONISTA") tr.style.background = "#fdecea"; });
  ctx.area.querySelectorAll("tbody td:last-child").forEach(td => td.style.whiteSpace = "normal");
}

// ---- 4) Extrapolamento de horas mensais/semanais ----
async function relExtrapolamento(ctx) {
  const plantoes = await buscarPlantoesPeriodo(ctx.setorIds, ctx.dataInicio, ctx.dataFim);
  const porProfissional = {};
  plantoes.forEach(p => {
    const info = mapaCodigosDoSetor(p.setorId)[p.codigo]; if (!info) return;
    (porProfissional[p.profissionalId] ||= { horasMes:0, semanas:{} });
    porProfissional[p.profissionalId].horasMes += info.horas;
    const inicioSemana = new Date(p.data); inicioSemana.setDate(p.data.getDate() - p.data.getDay());
    const chaveSemana = inicioSemana.toISOString().slice(0,10);
    porProfissional[p.profissionalId].semanas[chaveSemana] = (porProfissional[p.profissionalId].semanas[chaveSemana]||0) + info.horas;
  });
  const linhas = [];
  Object.entries(porProfissional).forEach(([profId,dados]) => {
    if (ctx.profFiltroId && profId !== ctx.profFiltroId) return;
    const prof = ctx.profissionais.find(p=>p.id===profId); if (!prof) return;
    const limiteMensal = prof.limiteHorasMensais ?? 220;
    const limiteSemanal = prof.limiteHorasSemanais ?? 44;
    if (dados.horasMes > limiteMensal) linhas.push([prof.nome, "Mensal", dados.horasMes+"h", limiteMensal+"h", (dados.horasMes-limiteMensal)+"h"]);
    Object.entries(dados.semanas).forEach(([semana,h]) => {
      if (h > limiteSemanal) linhas.push([prof.nome, `Semana de ${fmtDataBR(semana)}`, h+"h", limiteSemanal+"h", (h-limiteSemanal)+"h"]);
    });
  });
  montarTabelaRelatorio(ctx.area, "Extrapolamento de Horas (Mensal/Semanal)", ctx.dataInicio, ctx.dataFim,
    ["Profissional","Período","Horas trabalhadas","Limite","Excedente"], linhas);
}

function calcularValorPeriodo(plantoes, profissionais) {
  const porProf = {};
  plantoes.forEach(p => {
    const info = mapaCodigosDoSetor(p.setorId)[p.codigo]; if (!info) return;
    const prof = profissionais.find(x=>x.id===p.profissionalId); if (!prof) return;
    const valorHora = buscarValorHora(p.setorId, prof.categoria||"Médico");
    (porProf[p.profissionalId] ||= { prof, horas:0, valor:0, plantoes:0 });
    porProf[p.profissionalId].horas += info.horas;
    porProf[p.profissionalId].valor += info.horas*valorHora;
    porProf[p.profissionalId].plantoes += 1;
  });
  return porProf;
}

// ---- Relatórios do Ponto Digital ----
async function buscarPontosPeriodo(dataInicioStr, dataFimStr, profFiltroId) {
  const inicio = new Date(dataInicioStr+"T00:00:00");
  const fim = new Date(dataFimStr+"T23:59:59");
  let query = db.collection("pontos");
  query = profFiltroId ? query.where("profissionalId","==",profFiltroId) : query.limit(3000);
  const snap = await query.get();
  return snap.docs.map(d=>({id:d.id,...d.data()}))
    .filter(p => p.criadoEm?.toDate && p.criadoEm.toDate() >= inicio && p.criadoEm.toDate() <= fim)
    .sort((a,b)=>(a.criadoEm?.toMillis()||0)-(b.criadoEm?.toMillis()||0));
}
function calcularHorasDia(regsDoDia) {
  const porTipo = {}; regsDoDia.forEach(r => { if (!porTipo[r.tipo]) porTipo[r.tipo] = r; });
  const entrada = porTipo["Entrada"]?.criadoEm?.toDate();
  const saida = porTipo["Saída"]?.criadoEm?.toDate();
  if (!entrada || !saida) return null;
  let ms = saida - entrada;
  const saiInt = porTipo["Saída Intervalo"]?.criadoEm?.toDate();
  const voltaInt = porTipo["Retorno Intervalo"]?.criadoEm?.toDate();
  if (saiInt && voltaInt) ms -= (voltaInt - saiInt);
  return ms > 0 ? ms/3600000 : null;
}

  const porDia = {};
  registros.forEach(r => { const dia = r.criadoEm.toDate().toISOString().slice(0,10); (porDia[dia] ||= []).push(r); });
  const linhas = []; let totalGeral = 0;
  Object.keys(porDia).sort().forEach(dia => {

    const horas = calcularHorasDia(regsDia);
    if (horas!=null) { linhas.push([`Total do dia ${fmtDataBR(dia)}`,"","","","",horas.toFixed(2)+"h"]); totalGeral += horas; }
  });
  const nomeProf = ctx.profissionais.find(p=>p.id===ctx.profFiltroId)?.nome || "";

async function relPontoXEscala(ctx) {
  const plantoes = await buscarPlantoesPeriodo(ctx.setorIds, ctx.dataInicio, ctx.dataFim);
  const filtrados = plantoes.filter(p => !ctx.profFiltroId || p.profissionalId === ctx.profFiltroId);
  const registrosPonto = await buscarPontosPeriodo(ctx.dataInicio, ctx.dataFim, ctx.profFiltroId);
  const linhas = filtrados.map(p => {
    const info = mapaCodigosDoSetor(p.setorId)[p.codigo];
    const prof = ctx.profissionais.find(x=>x.id===p.profissionalId);
    const diaStr = `${p.ano}-${fmtData2(p.mes)}-${fmtData2(p.dia)}`;
    const entradaBatida = registrosPonto.find(r => r.profissionalId===p.profissionalId && r.tipo==="Entrada" && r.criadoEm.toDate().toISOString().slice(0,10)===diaStr);
    const previsto = info?.inicio || "-";
    const batido = entradaBatida ? entradaBatida.criadoEm.toDate().toLocaleTimeString("pt-BR").slice(0,5) : "NÃO BATEU";
    let diferenca = "-";
    if (entradaBatida && info?.inicio) {
      const [ph,pm] = info.inicio.split(":").map(Number);
      const b = entradaBatida.criadoEm.toDate();
      const diffMin = (b.getHours()*60+b.getMinutes()) - (ph*60+pm);
      diferenca = (diffMin>0?"+":"") + diffMin + " min";
    }
    return [fmtData2(p.dia)+"/"+fmtData2(p.mes)+"/"+p.ano, prof?.nome||"?", ctx.nomeSetorFn(p.setorId), p.codigo, previsto, batido, diferenca];
  });
  montarTabelaRelatorio(ctx.area, "Ponto Digital · Ponto x Escala (previsto x batido)", ctx.dataInicio, ctx.dataFim,
    ["Data","Profissional","Escala","Código","Previsto","Batido (Entrada)","Diferença"], linhas);
}

// 10d. PONTO DIGITAL (biometria facial + geolocalização, roda 100% no navegador)
// -------------------------------------------------------------------------
const FACE_MODEL_URL = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";
const LIMIAR_RECONHECIMENTO_FACIAL = 0.5; // quanto menor, mais rígido (0.4~0.6 é a faixa usual)
const TIPOS_PONTO = ["Entrada","Saída Intervalo","Retorno Intervalo","Saída"];
const TEXTO_CONSENTIMENTO_BIOMETRIA = `Ao continuar, você concorda que sua imagem facial seja processada, no seu
próprio navegador, para gerar um "molde" matemático do seu rosto (não a foto em si), usado exclusivamente para
confirmar sua identidade ao bater o ponto. Esse molde fica guardado de forma restrita, vinculado só ao seu
cadastro, e você pode revogar este consentimento e apagar seus dados biométricos a qualquer momento nesta mesma
tela. Se preferir não usar biometria, você pode bater o ponto normalmente confirmando com sua senha.`;

let ESTADO_PONTO = { modelosCarregados:false, streamAtivo:null };

async function carregarModelosFace() {
  if (ESTADO_PONTO.modelosCarregados) return;
  await faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL);
  ESTADO_PONTO.modelosCarregados = true;
}

async function iniciarCamera(videoEl) {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:"user" }, audio:false });
  videoEl.srcObject = stream;
  await videoEl.play();
  ESTADO_PONTO.streamAtivo = stream;
  return stream;
}
function pararCamera() {
  ESTADO_PONTO.streamAtivo?.getTracks().forEach(t=>t.stop());
  ESTADO_PONTO.streamAtivo = null;
}

async function capturarDescritorFacial(videoEl) {
  const deteccao = await faceapi.detectSingleFace(videoEl, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks().withFaceDescriptor();
  return deteccao ? Array.from(deteccao.descriptor) : null;
}

function distanciaMetros(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = g => g*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function obterGeolocalizacao() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error("Este navegador não suporta geolocalização.")); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat:pos.coords.latitude, lng:pos.coords.longitude, precisao:pos.coords.accuracy }),
      err => reject(new Error("Não foi possível obter sua localização: " + err.message)),
      { enableHighAccuracy:true, timeout:15000 }
    );
  });
}

async function carregarBiometria(profId) {
  const snap = await db.collection("biometriaFacial").doc(profId).get();
  return snap.exists ? snap.data() : null;
}

function modalBaterPonto(prof, entidade, tipoSugerido, biometria) {
  const div = document.createElement("div");

  div.innerHTML = `
    <div class="modal">

      <p id="statusPonto" style="font-size:.85rem;color:#6b7280">Obtendo sua localização...</p>
      <div id="areaVerificacao"></div>
      <div class="acoes"><button class="btn btn-secundario" id="mCancelar">Cancelar</button></div>
    </div>`;
  document.body.appendChild(div);
  let tipoEscolhido = tipoSugerido;
  let geo = null;

  function fechar() { pararCamera(); div.remove(); }
  div.querySelector("#mCancelar").addEventListener("click", fechar);
  div.querySelectorAll(".btnTipoPonto").forEach(b => b.addEventListener("click", () => {
    tipoEscolhido = b.dataset.tipo;
    div.querySelectorAll(".btnTipoPonto").forEach(x=>x.className = "btn btn-secundario btnTipoPonto");
    b.className = "btn btn-primario btnTipoPonto";
  }));

  const status = div.querySelector("#statusPonto");
  const areaVerificacao = div.querySelector("#areaVerificacao");

  async function checarLocalizacaoEProsseguir() {
    areaVerificacao.innerHTML = "";
    status.textContent = "Obtendo sua localização...";
    try {
      geo = await obterGeolocalizacao();
      const temCoordenadaEntidade = entidade?.latitude!=null && entidade?.longitude!=null;
      const distanciaAtual = temCoordenadaEntidade ? Math.round(distanciaMetros(geo.lat,geo.lng,entidade.latitude,entidade.longitude)) : null;
      const limite = entidade?.raioMetros || 200;
      const dentro = temCoordenadaEntidade ? distanciaAtual <= limite : null;

      if (temCoordenadaEntidade) {
        status.innerHTML = `📍 Localização obtida (precisão ${Math.round(geo.precisao)}m) — distância até o local: <b>${distanciaAtual}m</b> (limite: ${limite}m)`;
      } else {
        status.innerHTML = `📍 Localização obtida (precisão ${Math.round(geo.precisao)}m) — este local não tem coordenadas cadastradas, então a distância não está sendo conferida.`;
      }

      if (dentro === false) {
        areaVerificacao.innerHTML = `
          <div class="msg-erro">
            🚫 Você está a <b>${distanciaAtual}m</b> do local — acima do limite de <b>${limite}m</b> definido pelo Administrador para esta entidade.
            Aproxime-se do local para conseguir bater o ponto. Se você tem certeza de que está no lugar certo (ex.: prédio grande, sinal de GPS ruim),
            peça a um gestor para fazer um lançamento manual/justificado.
          </div>
          <button class="btn btn-secundario" id="btnTentarNovoLocal" style="width:100%;margin-top:8px">🔄 Tentar novamente</button>`;
        areaVerificacao.querySelector("#btnTentarNovoLocal").addEventListener("click", checarLocalizacaoEProsseguir);
        return;
      }

      mostrarVerificacaoIdentidade();
    } catch (err) {
      status.textContent = "⚠️ " + err.message;
      areaVerificacao.innerHTML = `<button class="btn btn-secundario" id="btnTentarNovoLocal" style="width:100%">🔄 Tentar novamente</button>`;
      areaVerificacao.querySelector("#btnTentarNovoLocal").addEventListener("click", checarLocalizacaoEProsseguir);
    }
  }

  function mostrarVerificacaoIdentidade() {
    if (biometria) {
      areaVerificacao.innerHTML = `

        const sucesso = dist <= LIMIAR_RECONHECIMENTO_FACIAL;
        if (!sucesso) { statusFace.textContent = "❌ Rosto não reconhecido. Tente novamente ou peça a um gestor para lançar manualmente."; btnConfirmar.disabled = false; return; }

  checarLocalizacaoEProsseguir();

async function salvarPonto(prof, entidade, tipo, geo, verificacaoFacial) {
  const dentro = (entidade?.latitude!=null && geo?.lat!=null) ? distanciaMetros(geo.lat,geo.lng,entidade.latitude,entidade.longitude) <= (entidade.raioMetros||200) : null;
  const distanciaMetrosCalc = (entidade?.latitude!=null && geo?.lat!=null) ? Math.round(distanciaMetros(geo.lat,geo.lng,entidade.latitude,entidade.longitude)) : null;
  await db.collection("pontos").add({
    profissionalId: prof.id, profissionalNome: prof.nome,
    entidadeId: entidade?.id||"", entidadeNome: entidade?(entidade.nomeFantasia||entidade.razaoSocial):"",
    tipo, latitude: geo?.lat??null, longitude: geo?.lng??null, precisao: geo?.precisao??null,
    distanciaMetros: distanciaMetrosCalc, dentroDoRaio: dentro,
    verificacaoFacial, manual:false,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
    registradoPor: ESTADO.usuarioDoc.nome,
  });
  alert(`Ponto registrado: ${tipo} às ${new Date().toLocaleTimeString("pt-BR")}.`);
  renderPontoDigital();
}

async function pontosDeHoje(profId) {
  const hoje = new Date(); const inicio = new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate());
  const snap = await db.collection("pontos").where("profissionalId","==",profId).get();
  return snap.docs.map(d=>({id:d.id,...d.data()}))
    .filter(p => p.criadoEm?.toDate && p.criadoEm.toDate() >= inicio)
    .sort((a,b)=>(a.criadoEm?.toMillis()||0)-(b.criadoEm?.toMillis()||0));
}

function proximoTipoSugerido(registrosHoje) {
  const tipos = registrosHoje.map(r=>r.tipo);
  for (const t of TIPOS_PONTO) if (!tipos.includes(t)) return t;
  return TIPOS_PONTO[0];
}

    if (!justificativa) { alert("Informe a justificativa."); return; }
    const prof = profissionais.find(p=>p.id===div.querySelector("#lmProf").value);
    const dataStr = div.querySelector("#lmData").value, horaStr = div.querySelector("#lmHora").value;
    const dataHora = new Date(`${dataStr}T${horaStr}:00`);
    const entidade = prof?.entidadeId ? ESTADO.cacheEntidades.find(e=>e.id===prof.entidadeId) : null;
    await db.collection("pontos").add({
      profissionalId: prof.id, profissionalNome: prof.nome,
      entidadeId: entidade?.id||"", entidadeNome: entidade?(entidade.nomeFantasia||entidade.razaoSocial):"",

    });
    div.remove();
    renderPontoDigital();
  });
}

async function renderFechamento() {

      <select id="rAno">${anosOpcoes.map(a=>`<option value="${a}" ${a===ano?"selected":""}>${a}</option>`).join("")}</select>
      <button class="btn btn-secundario" id="rMesProx" style="padding:8px 12px" title="Próximo mês">›</button>

    </div>

      <button class="btn btn-primario" id="btnImprimirRel">🖨️ Imprimir / PDF</button>
      <button class="btn btn-sucesso" id="btnExcel">📊 Exportar Excel (.xlsx)</button>
      <button class="btn btn-secundario" id="btnCsv">📄 Exportar CSV</button>
    </div>
    <div id="areaRelatorio" class="cartao">Selecione o tipo de relatório e o período, depois clique em "Gerar relatório".</div>`;

  const rTipo = document.getElementById("rTipo");
  rTipo.addEventListener("change", () => {
    document.getElementById("rSetor").style.display = rTipo.value === "setor" ? "" : "none";
    document.getElementById("rProfissional").style.display = rTipo.value === "profissional" ? "" : "none";
  });

  document.getElementById("btnImprimirRel").addEventListener("click", () => window.print());
  document.getElementById("btnExcel").addEventListener("click", exportarExcel);
  document.getElementById("btnCsv").addEventListener("click", exportarCsv);
  document.getElementById("btnGerar").addEventListener("click", gerarFechamentoSelecionado);
  const moverMesFech = (d) => {
    const selM = document.getElementById("rMes"), selA = document.getElementById("rAno");
    let m = +selM.value + d, a = +selA.value; if (m<1){m=12;a--;} if (m>12){m=1;a++;}
    if (![...selA.options].some(o => +o.value === a)) selA.insertAdjacentHTML(d<0?"afterbegin":"beforeend", `<option value="${a}">${a}</option>`);
    selM.value = m; selA.value = a; gerarFechamentoSelecionado();

// Avisa no Fechamento se a competência ainda está aberta ou se há escala não liberada no mês.
async function avisoSituacaoFechamento(mes, ano) {
  const area = document.getElementById("avisoFechamento");
  if (!area) return;
  const comp = await statusCompetencia(ano, mes);
  const naoLib = [];
  for (const t of ESTADO.cacheTiposEscala) if (!escalaEstaLiberada(await statusLiberacao(t.id, ano, mes, true))) naoLib.push(t.nome);
  const avisos = [];
  if (comp !== "fechada") avisos.push(`A competência de ${MESES[mes-1]}/${ano} ainda está <b>aberta</b> — os valores podem mudar se a escala for alterada. Feche-a em "Competências" antes de pagar.`);
  if (naoLib.length) avisos.push(`Escala(s) <b>não liberada(s)</b> neste mês: ${naoLib.map(escapeHtml).join(", ")}.`);
  area.innerHTML = avisos.length ? `<div class="ps-aviso" style="margin-bottom:12px">⚠️ ${avisos.join("<br>⚠️ ")}</div>` : `<div class="ps-aviso" style="margin-bottom:12px;background:#e6f6ee;border-color:#b7e2cb;color:#1e5c1a">✅ Competência fechada e todas as escalas liberadas.</div>`;
}

async function gerarFechamentoSelecionado() {
  const tipo = document.getElementById("rTipo").value;
  const mes = +document.getElementById("rMes").value;
  const ano = +document.getElementById("rAno").value;
  ESTADO.escalaAtual.mes = mes; ESTADO.escalaAtual.ano = ano;
  avisoSituacaoFechamento(mes, ano).catch(err => console.warn(err));
  if (tipo === "completo") return gerarRelatorioCompleto(mes, ano);
  if (tipo === "setor") return gerarRelatorioPorSetor(document.getElementById("rSetor").value, mes, ano);
  if (tipo === "profissional") return gerarRelatorioPorProfissional(document.getElementById("rProfissional").value, mes, ano);
}

function cabecalhoRelatorioHtml(titulo, mes, ano) {
  return `<div style="text-align:center;margin-bottom:14px">
    <h3 style="margin:0">SECRETARIA MUNICIPAL DE SAÚDE DE JABORANDI</h3>
    <div>${titulo} — ${MESES[mes-1]} de ${ano}</div>
  </div>`;
}

async function buscarDiasEscala(setorId, ano, mes) {
  const snap = await db.collection("escalas").where("setor","==",setorId).where("ano","==",ano).where("mes","==",mes).get();
  const porProf = {}; snap.docs.forEach(d => porProf[d.data().profissionalId] = d.data().dias || {});
  return porProf;
}

async function gerarRelatorioCompleto(mes, ano) {
  const area = document.getElementById("areaRelatorio");
  area.innerHTML = "Calculando...";
  const profissionais = await carregarProfissionais();
  const tipos = ESTADO.cacheTiposEscala;
  const dadosPorSetor = {};
  for (const t of tipos) dadosPorSetor[t.id] = await buscarDiasEscala(t.id, ano, mes);

  const linhas = profissionais.map(p => {
    let totalHoras = 0, totalValor = 0;
    const colunas = tipos.map(t => {
      const mapaCodigos = {}; (t.codigos||[]).forEach(c=>mapaCodigos[c.codigo]=c);
      const horas = calcularHorasProfissional(dadosPorSetor[t.id][p.id]||{}, mapaCodigos);
      const valorHora = buscarValorHora(t.id, p.categoria||"Médico");
      totalHoras += horas; totalValor += horas*valorHora;
      return horas;
    });
    return { p, colunas, totalHoras, totalValor };
  }).filter(l => l.totalHoras > 0);

  const totalGeral = linhas.reduce((s,l)=>s+l.totalValor,0);
  const colunasHtml = tipos.map(t=>`<th>${escapeHtml(t.nome)} (h)</th>`).join("");

  area.innerHTML = cabecalhoRelatorioHtml("Fechamento Completo", mes, ano) + `
    <table class="tabela">
      <thead><tr><th>Profissional</th><th>Categoria</th>${colunasHtml}<th>Total Horas</th><th>Total a Pagar</th></tr></thead>
      <tbody>
        ${linhas.map(l => `<tr>
          <td>${escapeHtml(l.p.nome)}</td><td>${escapeHtml(l.p.categoria||"Médico")}</td>
          ${l.colunas.map(h=>`<td>${h}h</td>`).join("")}
          <td>${l.totalHoras}h</td><td>${fmtMoeda(l.totalValor)}</td>
        </tr>`).join("")}
      </tbody>
      <tfoot><tr><td colspan="${2+tipos.length+1}" style="text-align:right;font-weight:700">TOTAL GERAL</td><td style="font-weight:700">${fmtMoeda(totalGeral)}</td></tr></tfoot>
    </table>`;

  ESTADO.ultimoRelatorio = {
    titulo: `Fechamento_Completo_${MESES[mes-1]}_${ano}`,
    colunas: ["Profissional","Categoria", ...tipos.map(t=>t.nome+" (h)"), "Total Horas", "Total a Pagar (R$)"],
    linhas: linhas.map(l => [l.p.nome, l.p.categoria||"Médico", ...l.colunas, l.totalHoras, l.totalValor.toFixed(2)]),
  };
}

async function gerarRelatorioPorSetor(setorId, mes, ano) {
  const area = document.getElementById("areaRelatorio");
  if (!setorId) { area.innerHTML = "Selecione um tipo de escala."; return; }
  area.innerHTML = "Calculando...";
  const tipo = ESTADO.cacheTiposEscala.find(t=>t.id===setorId);
  const mapaCodigos = {}; (tipo.codigos||[]).forEach(c=>mapaCodigos[c.codigo]=c);
  const profissionais = await carregarProfissionais();
  const dias = await buscarDiasEscala(setorId, ano, mes);

  const linhas = profissionais.map(p => {
    const horas = calcularHorasProfissional(dias[p.id]||{}, mapaCodigos);
    const valorHora = buscarValorHora(setorId, p.categoria||"Médico");
    return { p, horas, valorHora, valor: horas*valorHora };
  }).filter(l => l.horas > 0);

  const totalGeral = linhas.reduce((s,l)=>s+l.valor,0);

  area.innerHTML = cabecalhoRelatorioHtml(`Relatório · ${tipo.nome}`, mes, ano) + `
    <table class="tabela">
      <thead><tr><th>Profissional</th><th>Categoria</th><th>Horas</th><th>Valor/Hora</th><th>Total a Pagar</th></tr></thead>
      <tbody>
        ${linhas.map(l => `<tr>
          <td>${escapeHtml(l.p.nome)}</td><td>${escapeHtml(l.p.categoria||"Médico")}</td>
          <td>${l.horas}h</td><td>${fmtMoeda(l.valorHora)}</td><td>${fmtMoeda(l.valor)}</td>
        </tr>`).join("")}
      </tbody>
      <tfoot><tr><td colspan="4" style="text-align:right;font-weight:700">TOTAL GERAL</td><td style="font-weight:700">${fmtMoeda(totalGeral)}</td></tr></tfoot>
    </table>`;

  ESTADO.ultimoRelatorio = {
    titulo: `Relatorio_${tipo.nome.replace(/\s+/g,"_")}_${MESES[mes-1]}_${ano}`,
    colunas: ["Profissional","Categoria","Horas","Valor/Hora (R$)","Total a Pagar (R$)"],
    linhas: linhas.map(l => [l.p.nome, l.p.categoria||"Médico", l.horas, l.valorHora.toFixed(2), l.valor.toFixed(2)]),
  };
}

async function gerarRelatorioPorProfissional(profId, mes, ano) {
  const area = document.getElementById("areaRelatorio");
  if (!profId) { area.innerHTML = "Selecione um profissional."; return; }
  area.innerHTML = "Calculando...";
  const profissionais = await carregarProfissionais();
  const p = profissionais.find(x=>x.id===profId);
  const tipos = ESTADO.cacheTiposEscala;
  const totalDias = diasNoMes(ano, mes);

  const linhasDetalhe = [];
  let totalHorasGeral = 0, totalValorGeral = 0;
  for (const t of tipos) {
    const mapaCodigos = {}; (t.codigos||[]).forEach(c=>mapaCodigos[c.codigo]=c);
    const dias = (await buscarDiasEscala(t.id, ano, mes))[profId] || {};
    const valorHora = buscarValorHora(t.id, p.categoria||"Médico");
    for (let d=1; d<=totalDias; d++) {
      const cod = dias[d]; if (!cod) continue;
      const horas = mapaCodigos[cod]?.horas || 0;
      const valor = horas*valorHora;
      totalHorasGeral += horas; totalValorGeral += valor;
      linhasDetalhe.push({ dia:d, setor:t.nome, codigo:cod, nomeCodigo:mapaCodigos[cod]?.nome||cod, horas, valorHora, valor });
    }
  }
  linhasDetalhe.sort((a,b)=>a.dia-b.dia);

  area.innerHTML = cabecalhoRelatorioHtml(`Relatório Individual · ${p.nome}`, mes, ano) + `
    <p><b>Categoria:</b> ${escapeHtml(p.categoria||"Médico")} &nbsp; <b>CRM/COREN:</b> ${escapeHtml(p.crm||"-")} &nbsp; <b>CPF:</b> ${escapeHtml(p.cpf||"-")}</p>
    <table class="tabela">
      <thead><tr><th>Dia</th><th>Escala</th><th>Código</th><th>Descrição</th><th>Horas</th><th>Valor/Hora</th><th>Valor</th></tr></thead>
      <tbody>
        ${linhasDetalhe.map(l => `<tr>
          <td>${l.dia}</td><td>${escapeHtml(l.setor)}</td><td>${l.codigo}</td><td>${escapeHtml(l.nomeCodigo)}</td>
          <td>${l.horas}h</td><td>${fmtMoeda(l.valorHora)}</td><td>${fmtMoeda(l.valor)}</td>
        </tr>`).join("") || `<tr><td colspan="7">Nenhum plantão registrado neste período.</td></tr>`}
      </tbody>
      <tfoot><tr><td colspan="4" style="text-align:right;font-weight:700">TOTAL</td><td style="font-weight:700">${totalHorasGeral}h</td><td></td><td style="font-weight:700">${fmtMoeda(totalValorGeral)}</td></tr></tfoot>
    </table>`;

  ESTADO.ultimoRelatorio = {
    titulo: `Relatorio_${p.nome.replace(/\s+/g,"_")}_${MESES[mes-1]}_${ano}`,
    colunas: ["Dia","Escala","Código","Descrição","Horas","Valor/Hora (R$)","Valor (R$)"],
    linhas: linhasDetalhe.map(l => [l.dia, l.setor, l.codigo, l.nomeCodigo, l.horas, l.valorHora.toFixed(2), l.valor.toFixed(2)]),
  };
}

// ---- Exportação Excel (.xlsx) e CSV, a partir do último relatório gerado ----
function exportarExcel() {
  if (!ESTADO.ultimoRelatorio) { alert("Gere um relatório primeiro."); return; }
  const { titulo, colunas, linhas } = ESTADO.ultimoRelatorio;
  const ws = XLSX.utils.aoa_to_sheet([colunas, ...linhas]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Relatorio");
  XLSX.writeFile(wb, `${titulo}.xlsx`);
}

function exportarCsv() {
  if (!ESTADO.ultimoRelatorio) { alert("Gere um relatório primeiro."); return; }
  const { titulo, colunas, linhas } = ESTADO.ultimoRelatorio;
  const linhasCsv = [colunas, ...linhas].map(l => l.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(";"));
  const blob = new Blob(["\uFEFF" + linhasCsv.join("\r\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${titulo}.csv`;
  a.click();
}

// 14. MELHORIAS 5.05.2026 — inspiradas no PegaPlantão
//     Escala Semanal (setores nas linhas, 7 dias nas colunas, cartões com
//     médico e horário, "+" para incluir, "Replicar Semana", "Escala não
//     liberada"), liberação de escala por mês, agenda do profissional,
//     plantonistas de hoje, aviso de trocas pendentes e busca nas tabelas.
//     Nada aqui apaga ou substitui dado já lançado sem a pessoa pedir:
//     o "Replicar Semana" só preenche dias vazios.
// =========================================================================

// ---- Liberação da escala (por tipo de escala + mês) ----
// Guardada na própria coleção "escalas" (mesma regra do Firestore, sem regra nova),
// num documento de controle "_liberacao_{setor}_{ano}_{mes}". Esse documento NÃO tem
// os campos setor/ano/mes, então nenhuma consulta de plantões o enxerga.
function idLiberacao(setorId, ano, mes) { return `_liberacao_${setorId}_${ano}_${mes}`; }
let CACHE_LIBERACOES = {};
async function statusLiberacao(setorId, ano, mes, forcar=false) {
  const id = idLiberacao(setorId, ano, mes);
  if (!forcar && Object.prototype.hasOwnProperty.call(CACHE_LIBERACOES, id)) return CACHE_LIBERACOES[id];
  // Meses anteriores a nov/2026 (quando a liberação passou a existir) contam como liberados
  // enquanto ninguém mexer neles — assim o histórico não fica cheio de avisos.
  const anteriorAoControle = (ano*12 + mes) < (2026*12 + 11);
  try {
    const s = await db.collection("escalas").doc(id).get();
    CACHE_LIBERACOES[id] = s.exists ? s.data() : (anteriorAoControle ? { liberada:true, implicita:true } : null);
  } catch (e) { CACHE_LIBERACOES[id] = anteriorAoControle ? { liberada:true, implicita:true } : null; }
  return CACHE_LIBERACOES[id];
}
function escalaEstaLiberada(dado) { return !!(dado && dado.liberada); }
async function alternarLiberacao(setorId, ano, mes) {
  const tipo = ESTADO.cacheTiposEscala.find(t => t.id === setorId);
  const atual = await statusLiberacao(setorId, ano, mes, true);
  const liberar = !escalaEstaLiberada(atual);
  const nome = tipo ? tipo.nome : setorId;
  const pergunta = liberar
    ? `Liberar a escala "${nome}" de ${MESES[mes-1]}/${ano}?\n\nEla passa a aparecer como DEFINITIVA para todos os profissionais. Você continua podendo editar enquanto a competência estiver aberta.`
    : `Marcar a escala "${nome}" de ${MESES[mes-1]}/${ano} como NÃO LIBERADA (em elaboração)?\n\nNenhum plantão é apagado — os profissionais só passam a ver o aviso "Escala não liberada".`;
  if (!confirm(pergunta)) return false;
  const dados = {
    tipoDoc: "liberacao", liberacaoSetor: setorId, liberacaoAno: ano, liberacaoMes: mes,
    liberada: liberar, atualizadoEm: Date.now(), atualizadoPor: ESTADO.usuarioDoc.nome || ESTADO.usuario?.email || "",
  };
  if (liberar) { dados.liberadaEm = Date.now(); dados.liberadaPor = dados.atualizadoPor; }
  await db.collection("escalas").doc(idLiberacao(setorId, ano, mes)).set(dados, { merge:true });
  CACHE_LIBERACOES[idLiberacao(setorId, ano, mes)] = { ...(atual||{}), ...dados };
  return true;
}
function chipLiberacao(dado, clicavel, attrs="") {
  const lib = escalaEstaLiberada(dado);
  const quando = lib && dado.liberadaEm ? ` em ${new Date(dado.liberadaEm).toLocaleDateString("pt-BR")}` : "";
  const titulo = lib ? (dado.implicita ? "Mês anterior ao controle de liberação — considerado liberado" : `Liberada${quando}${dado.liberadaPor?` por ${dado.liberadaPor}`:""}`) : "Escala ainda em elaboração — pode mudar";
  const tag = clicavel ? "button" : "span";
  return `<${tag} class="chip-liberacao ${lib?"lib-sim":"lib-nao"}" title="${escapeHtml(titulo)}${clicavel?" (clique para alterar)":""}" ${attrs}>${lib?"✅ Escala liberada":"🚫 Escala não liberada"}</${tag}>`;
}

// ---- Datas da semana (segunda a domingo, como no PegaPlantão) ----
function inicioDaSemana(dt) { const d = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; }
function somarDias(dt, n) { const d = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()); d.setDate(d.getDate()+n); return d; }
function mesmaData(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function fmtDiaMes(dt) { return `${fmtData2(dt.getDate())}/${fmtData2(dt.getMonth()+1)}`; }
function horaFimTurno(info) {
  if (!info) return "";
  const [hh,mm] = String(info.inicio||"07:00").split(":").map(Number);
  const totalMin = (hh*60 + (mm||0) + Math.round((+info.horas||0)*60)) % (24*60);
  return `${fmtData2(Math.floor(totalMin/60))}:${fmtData2(totalMin%60)}`;
}
function minutosInicio(info) { const [hh,mm] = String(info?.inicio||"00:00").split(":").map(Number); return hh*60+(mm||0); }
function competenciaFechadaCache(ano, mes) { return ESTADO.cacheCompetenciasFechadas[idCompetencia(ano,mes)] === "fechada"; }
async function carregarStatusCompetencias(listaMeses) {
  for (const m of listaMeses) ESTADO.cacheCompetenciasFechadas[idCompetencia(m.ano,m.mes)] = await statusCompetencia(m.ano, m.mes);
}

// Grava vários plantões de uma vez (lote), sem apagar nada que já existe no documento.
async function gravarPlantoesEmLote(itens) {
  for (let i = 0; i < itens.length; i += 400) {
    const lote = db.batch();
    itens.slice(i, i+400).forEach(it => {
      const ref = db.collection("escalas").doc(`${it.setor}_${it.ano}_${it.mes}_${it.profissionalId}`);
      lote.set(ref, { setor:it.setor, ano:it.ano, mes:it.mes, profissionalId:it.profissionalId, dias:{ [String(it.dia)]: it.codigo } }, { merge:true });
    });
    await lote.commit();
  }
}

// Busca os plantões de um conjunto de setores em um conjunto de meses.
// Retorna { "setor|ano|mes": { profId: {dia: codigo} } }
async function buscarEscalasMeses(setorIds, meses) {
  const res = {};
  for (const setorId of setorIds) for (const m of meses) {
    const chave = `${setorId}|${m.ano}|${m.mes}`;
    res[chave] = {};
    const snap = await db.collection("escalas").where("setor","==",setorId).where("ano","==",m.ano).where("mes","==",m.mes).get();
    snap.docs.forEach(d => { const x = d.data(); res[chave][x.profissionalId] = { ...(x.dias||{}) }; });
  }
  return res;
}

let ESTADO_SEMANAL = { inicio: inicioDaSemana(new Date()), busca: "", entidadeId: "" };

async function renderEscalaSemanal() {
  const vp = document.getElementById("viewport");
  vp.innerHTML = `<div class="cartao">Carregando escala semanal...</div>`;
  await recarregarTiposEscala();
  await carregarEntidades();
  const profissionais = await carregarProfissionais();
  const inicio = ESTADO_SEMANAL.inicio;
  const dias = Array.from({length:7}, (_,i) => somarDias(inicio, i));
  const hoje = new Date();
  const meses = []; dias.forEach(d => { if (!meses.some(m => m.ano===d.getFullYear() && m.mes===d.getMonth()+1)) meses.push({ ano:d.getFullYear(), mes:d.getMonth()+1 }); });
  await carregarStatusCompetencias(meses);
  const podeEditarEscalas = podeEditarTela("escalas");
  const todosTipos = ESTADO.cacheTiposEscala;
  const dados = await buscarEscalasMeses(todosTipos.map(t=>t.id), meses);
  for (const t of todosTipos) for (const m of meses) await statusLiberacao(t.id, m.ano, m.mes);

  const busca = ESTADO_SEMANAL.busca.trim().toLowerCase();
  const tiposVisiveis = todosTipos.filter(t =>
    (!busca || t.nome.toLowerCase().includes(busca) || nomeEntidade(t.entidadeId).toLowerCase().includes(busca)) &&
    (!ESTADO_SEMANAL.entidadeId || t.entidadeId === ESTADO_SEMANAL.entidadeId));
  const meuProfId = ESTADO.usuarioDoc.profissionalId;
  const nomeProf = id => profissionais.find(p => p.id === id)?.nome || "?";

  // Monta os cartões de cada setor/dia
  function cartoesDoDia(tipo, dt) {
    const chave = `${tipo.id}|${dt.getFullYear()}|${dt.getMonth()+1}`;
    const mapa = {}; (tipo.codigos||[]).forEach(c => mapa[c.codigo] = c);
    const lista = [];
    Object.entries(dados[chave]||{}).forEach(([profId, diasObj]) => {
      const cod = diasObj[String(dt.getDate())];
      if (cod) lista.push({ profId, cod, info: mapa[cod] });
    });
    lista.sort((a,b) => (minutosInicio(a.info) - minutosInicio(b.info)) || nomeProf(a.profId).localeCompare(nomeProf(b.profId)));
    return lista;
  }

  const rotuloMes = meses.map(m => `${MESES[m.mes-1].toUpperCase()}<small>/${m.ano}</small>`).join(" – ");
  const liberacaoPendente = tiposVisiveis.some(t => meses.some(m => !escalaEstaLiberada(CACHE_LIBERACOES[idLiberacao(t.id,m.ano,m.mes)])));

        <select id="psEntidade" title="Filtrar por unidade">
          <option value="">Todas as unidades</option>
          ${ESTADO.cacheEntidades.map(e => `<option value="${e.id}" ${e.id===ESTADO_SEMANAL.entidadeId?"selected":""}>${escapeHtml(e.nomeFantasia||e.razaoSocial)}</option>`).join("")}
        </select>
        <button class="btn btn-secundario ps-acao" id="psMensal" title="Abrir a grade mensal">🗓️ Mensal</button>
        <button class="btn btn-secundario ps-acao" id="psImprimir">🖨️ Imprimir</button>
      </div>
    </div>
    ${liberacaoPendente && !podeEditarEscalas ? `<div class="ps-aviso">⚠️ Há escalas desta semana que ainda <b>não foram liberadas</b> — elas podem mudar até a liberação.</div>` : ""}
    <div class="ps-rolagem">
      <div class="ps-grade">
        <div class="ps-cab-mes">
          <button class="ps-seta ps-acao" id="psAnterior" title="Semana anterior">‹</button>
          <span class="ps-rotulo-mes">📅 ${rotuloMes}</span>
          <button class="ps-seta ps-acao" id="psProxima" title="Próxima semana">›</button>
          <button class="ps-hoje ps-acao" id="psHoje" title="Voltar para a semana atual">Hoje</button>
          <input type="date" class="ps-acao" id="psIrPara" title="Ir para a semana de uma data" value="${inicio.getFullYear()}-${fmtData2(inicio.getMonth()+1)}-${fmtData2(inicio.getDate())}">
        </div>
        ${dias.map(d => `<div class="ps-cab-dia ${mesmaData(d,hoje)?"ps-hoje-col":""}"><span class="ps-num">${d.getDate()}</span><span class="ps-sem">${DIAS_SEMANA[d.getDay()].toUpperCase()}</span></div>`).join("")}

        ${tiposVisiveis.map(tipo => {
          let totalHoras = 0, totalPlantoes = 0;
          const celulas = dias.map(dt => {

            const fechada = competenciaFechadaCache(ano, mes);
            const lib = escalaEstaLiberada(CACHE_LIBERACOES[idLiberacao(tipo.id, ano, mes)]);
            const podeEditarCel = podeEditarEscalas && !fechada;

              ${lista.map(c => {

                     data-prof="${c.profId}" data-cod="${escapeHtml(c.cod)}" data-acao="${podeEditarCel?"editar":(podeTrocar?"trocar":"")}" title="${escapeHtml(titulo)}">

              ${podeEditarCel ? `<button class="ps-add ps-acao" title="Incluir plantão em ${fmtDiaMes(dt)}">+</button>` : ""}
            </div>`;

          const chips = meses.map(m => {

            </div>
            ${celulas}`;
        }).join("") || `<div class="ps-vazio">Nenhum setor encontrado${busca?` para "${escapeHtml(ESTADO_SEMANAL.busca)}"`:""}.</div>`}
      </div>
    </div>
    <p class="ps-rodape-ajuda">${podeEditarEscalas
      ? "Clique no <b>+</b> para incluir um plantão, ou num cartão para alterar/remover. O <b>Replicar Semana</b> copia esta semana para as seguintes, só nos dias vazios."
      : "Seus plantões aparecem com contorno azul — clique num deles para solicitar troca."} Cartões em tom claro = escala ainda não liberada.</p>`;

  // ---- eventos ----
  const recarregar = () => renderEscalaSemanal();
  document.getElementById("psAnterior").addEventListener("click", () => { ESTADO_SEMANAL.inicio = somarDias(inicio, -7); recarregar(); });
  document.getElementById("psProxima").addEventListener("click", () => { ESTADO_SEMANAL.inicio = somarDias(inicio, 7); recarregar(); });
  document.getElementById("psHoje").addEventListener("click", () => { ESTADO_SEMANAL.inicio = inicioDaSemana(new Date()); recarregar(); });
  document.getElementById("psIrPara").addEventListener("change", e => { if (!e.target.value) return; const [a,m,d] = e.target.value.split("-").map(Number); ESTADO_SEMANAL.inicio = inicioDaSemana(new Date(a, m-1, d)); recarregar(); });
  let timerBusca = null;
  document.getElementById("psBusca").addEventListener("input", e => { clearTimeout(timerBusca); timerBusca = setTimeout(() => { ESTADO_SEMANAL.busca = e.target.value; recarregar(); }, 350); });
  document.getElementById("psEntidade").addEventListener("change", e => { ESTADO_SEMANAL.entidadeId = e.target.value; recarregar(); });
  document.getElementById("psImprimir").addEventListener("click", () => window.print());
  document.getElementById("psMensal").addEventListener("click", () => {
    const alvo = tiposVisiveis[0] || todosTipos[0];
    if (!alvo) return;
    ESTADO.escalaAtual.mes = inicio.getMonth()+1; ESTADO.escalaAtual.ano = inicio.getFullYear();
    ESTADO.telaAtual = "escala-" + alvo.id; renderApp();
  });
  vp.querySelectorAll("[data-liberar]").forEach(b => { if (b.tagName === "BUTTON") b.addEventListener("click", async () => {
    if (await alternarLiberacao(b.dataset.liberar, +b.dataset.ano, +b.dataset.mes)) recarregar();
  }); });
  vp.querySelectorAll("[data-replicar]").forEach(b => b.addEventListener("click", () => {
    const tipo = todosTipos.find(t => t.id === b.dataset.replicar);
    modalReplicarSemana(tipo, dias, dados, recarregar);
  }));
  vp.querySelectorAll(".ps-celula").forEach(cel => {
    const tipo = todosTipos.find(t => t.id === cel.dataset.setor);
    const [ano, mes, dia] = cel.dataset.data.split("-").map(Number);
    cel.querySelector(".ps-add")?.addEventListener("click", () => modalPlantaoSemanal({ tipo, ano, mes, dia, dados, profissionais, aoSalvar: recarregar }));
    cel.querySelectorAll(".ps-card").forEach(card => card.addEventListener("click", () => {
      const acao = card.dataset.acao;
      if (acao === "editar") modalPlantaoSemanal({ tipo, ano, mes, dia, dados, profissionais, profAtual: card.dataset.prof, codAtual: card.dataset.cod, aoSalvar: recarregar });
      else if (acao === "trocar") {
        const mapa = {}; (tipo.codigos||[]).forEach(c => mapa[c.codigo] = c);
        const participantes = profissionais.filter(p => p.ativo !== false && (!Array.isArray(tipo.participantes) || tipo.participantes.includes(p.id)));
        modalSolicitarTroca(tipo, profissionais.find(p => p.id === meuProfId), dia, card.dataset.cod, ano, mes, mapa, participantes);
      }
    }));
  });
}

// ---- Incluir / alterar / remover um plantão pela escala semanal ----
async function modalPlantaoSemanal({ tipo, ano, mes, dia, dados, profissionais, profAtual, codAtual, aoSalvar }) {
  const editando = !!profAtual;
  const codigos = tipo.codigos || [];
  const mapa = {}; codigos.forEach(c => mapa[c.codigo] = c);
  const participantes = profissionais.filter(p => (p.ativo !== false || p.id === profAtual) && (!Array.isArray(tipo.participantes) || tipo.participantes.includes(p.id) || p.id === profAtual));
  const dataTxt = `${fmtData2(dia)}/${fmtData2(mes)}/${ano} (${DIAS_SEMANA[new Date(ano,mes-1,dia).getDay()]})`;
  const div = document.createElement("div");
  div.className = "modal-fundo";
  div.innerHTML = `
    <div class="modal" style="max-width:460px">
      <h3>${editando ? "✏️ Alterar plantão" : "➕ Incluir plantão"}</h3>
      <p style="margin:-6px 0 12px;color:#6b7280;font-size:.85rem">${escapeHtml(tipo.nome)} — ${dataTxt}</p>
      <div id="psMsg"></div>
      <div class="campo"><label>Profissional</label>
        <select id="psProf">${participantes.map(p => `<option value="${p.id}" ${p.id===profAtual?"selected":""}>${escapeHtml(p.nome)}</option>`).join("")}</select>
      </div>
      <div class="campo"><label>Turno / código</label>
        <select id="psCod">${codigos.map(c => `<option value="${escapeHtml(c.codigo)}" ${c.codigo===codAtual?"selected":""}>${escapeHtml(c.codigo)} — ${escapeHtml(c.nome)} (${escapeHtml(c.inicio||"")} às ${horaFimTurno(c)}, ${c.horas}h)</option>`).join("")}</select>
      </div>
      <div id="psAlertas" style="font-size:.82rem"></div>
      <div class="acoes">
        ${editando ? `<button class="btn btn-perigo" id="psRemover" style="margin-right:auto">🗑️ Remover</button>` : ""}
        <button class="btn btn-secundario" id="psCancelar">Cancelar</button>
        <button class="btn btn-primario" id="psSalvar" style="width:auto">Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  if (!participantes.length) div.querySelector("#psMsg").innerHTML = `<div class="msg-erro">Nenhum profissional ativo nesta escala. Use "👥 Profissionais desta escala" na grade mensal.</div>`;
  div.querySelector("#psCancelar").addEventListener("click", () => div.remove());
  div.addEventListener("click", e => { if (e.target === div) div.remove(); });

  const chave = `${tipo.id}|${ano}|${mes}`;
  // Avisos (não bloqueiam): mesmo profissional já escalado neste dia em outro setor, ou afastado.
  async function atualizarAlertas() {
    const profId = div.querySelector("#psProf").value;
    const avisos = [];
    ESTADO.cacheTiposEscala.forEach(t => {
      if (t.id === tipo.id) return;
      const cod = dados[`${t.id}|${ano}|${mes}`]?.[profId]?.[String(dia)];
      if (cod) {
        const info = (t.codigos||[]).find(c => c.codigo === cod);
        avisos.push(`⚠️ Já está escalado(a) em <b>${escapeHtml(t.nome)}</b> neste dia (${escapeHtml(cod)}${info?` ${escapeHtml(info.inicio||"")}–${horaFimTurno(info)}`:""}).`);
      }
    });
    const jaAqui = dados[chave]?.[profId]?.[String(dia)];
    if (jaAqui && !(editando && profId === profAtual)) avisos.push(`⚠️ Já tem o código <b>${escapeHtml(jaAqui)}</b> nesta escala neste dia — salvar vai substituí-lo.`);
    try {
      const dataIso = `${ano}-${fmtData2(mes)}-${fmtData2(dia)}`;
      const snap = await db.collection("afastamentos").where("profissionalId","==",profId).get();
      snap.docs.map(d => d.data()).filter(a => a.dataInicio <= dataIso && (a.dataFim||a.dataInicio) >= dataIso)
        .forEach(a => avisos.push(`🚫 Afastamento registrado: <b>${escapeHtml(a.tipo)}</b> de ${fmtDataBR(a.dataInicio)} a ${fmtDataBR(a.dataFim||a.dataInicio)}.`));
    } catch (e) { /* sem permissão para ler afastamentos: ignora */ }
    div.querySelector("#psAlertas").innerHTML = avisos.map(a => `<div class="ps-alerta">${a}</div>`).join("");
  }
  div.querySelector("#psProf").addEventListener("change", atualizarAlertas);
  atualizarAlertas();

  div.querySelector("#psRemover")?.addEventListener("click", async () => {
    if (!confirm(`Remover o plantão de ${profissionais.find(p=>p.id===profAtual)?.nome||""} em ${dataTxt}?`)) return;
    await salvarCelulaEscala(tipo.id, ano, mes, profAtual, dia, "");
    div.remove(); aoSalvar();
  });
  div.querySelector("#psSalvar").addEventListener("click", async () => {
    const profId = div.querySelector("#psProf").value;
    const cod = div.querySelector("#psCod").value;
    if (!profId || !cod) return;
    const jaAqui = dados[chave]?.[profId]?.[String(dia)];
    if (jaAqui && jaAqui !== cod && !(editando && profId === profAtual)) {
      if (!confirm(`Este profissional já tem o código ${jaAqui} neste dia nesta escala. Substituir por ${cod}?`)) return;
    }
    const botao = div.querySelector("#psSalvar"); botao.disabled = true; botao.textContent = "Salvando...";
    try {
      if (editando && profId !== profAtual) await salvarCelulaEscala(tipo.id, ano, mes, profAtual, dia, "");
      await salvarCelulaEscala(tipo.id, ano, mes, profId, dia, cod);
      div.remove(); aoSalvar();
    } catch (err) {
      botao.disabled = false; botao.textContent = "Salvar";
      div.querySelector("#psMsg").innerHTML = `<div class="msg-erro">Não foi possível salvar: ${escapeHtml(err.message)}</div>`;
    }
  });
}

// ---- Replicar Semana: copia a semana do setor para as próximas, SÓ nos dias vazios ----
function modalReplicarSemana(tipo, dias, dados, aoTerminar) {
  const div = document.createElement("div");
  div.className = "modal-fundo";
  const ini = dias[0], fim = dias[6];
  const fimDoMes = new Date(fim.getFullYear(), fim.getMonth()+1, 0);
  const semanasAteFimMes = Math.max(1, Math.ceil((fimDoMes - fim) / (7*24*3600*1000)));
  div.innerHTML = `
    <div class="modal" style="max-width:460px">
      <h3>⧉ Replicar Semana</h3>
      <p style="margin:-6px 0 12px;color:#6b7280;font-size:.85rem">${escapeHtml(tipo.nome)} — semana de ${fmtDiaMes(ini)} a ${fmtDiaMes(fim)}/${fim.getFullYear()}</p>
      <div class="campo"><label>Copiar para</label>
        <select id="rpQtd">
          <option value="1">a próxima semana</option>
          <option value="2">as próximas 2 semanas</option>
          <option value="3">as próximas 3 semanas</option>
          <option value="4">as próximas 4 semanas</option>
          <option value="fimmes">até o fim de ${MESES[fimDoMes.getMonth()]} (${semanasAteFimMes} semana(s))</option>
        </select>
      </div>
      <div class="ps-alerta" style="background:#eef6ff;border-color:#bcd7f5;color:#073763">
        Só os dias <b>vazios</b> são preenchidos: se o profissional já tiver plantão lançado no dia de destino, nada é alterado.
        Meses com competência fechada são pulados.
      </div>
      <div id="rpResultado"></div>
      <div class="acoes">
        <button class="btn btn-secundario" id="rpCancelar">Cancelar</button>
        <button class="btn btn-primario" id="rpOk" style="width:auto">Replicar</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  div.querySelector("#rpCancelar").addEventListener("click", () => div.remove());
  div.querySelector("#rpOk").addEventListener("click", async () => {
    const v = div.querySelector("#rpQtd").value;
    const semanas = v === "fimmes" ? semanasAteFimMes : +v;
    const btn = div.querySelector("#rpOk"); btn.disabled = true; btn.textContent = "Replicando...";
    try {
      // origem: todos os plantões do setor nos 7 dias
      const origem = [];
      dias.forEach(dt => {
        const chave = `${tipo.id}|${dt.getFullYear()}|${dt.getMonth()+1}`;
        Object.entries(dados[chave]||{}).forEach(([profId, diasObj]) => {
          const cod = diasObj[String(dt.getDate())];
          if (cod) origem.push({ dt, profId, cod });
        });
      });
      if (!origem.length) { div.querySelector("#rpResultado").innerHTML = `<div class="msg-erro">Não há plantões nesta semana para replicar.</div>`; btn.disabled=false; btn.textContent="Replicar"; return; }
      // destino: carrega os meses envolvidos
      const destinos = [];
      for (let k = 1; k <= semanas; k++) origem.forEach(o => {
        const alvo = somarDias(o.dt, 7*k);
        if (v === "fimmes" && alvo > fimDoMes) return;
        destinos.push({ ...o, alvo });
      });
      const meses = []; destinos.forEach(d => { const m = { ano:d.alvo.getFullYear(), mes:d.alvo.getMonth()+1 }; if (!meses.some(x=>x.ano===m.ano&&x.mes===m.mes)) meses.push(m); });
      await carregarStatusCompetencias(meses);
      const atuais = await buscarEscalasMeses([tipo.id], meses);
      let gravados = 0, ocupados = 0, fechados = 0;
      const itens = [];
      destinos.forEach(d => {
        const ano = d.alvo.getFullYear(), mes = d.alvo.getMonth()+1, dia = d.alvo.getDate();
        if (competenciaFechadaCache(ano, mes)) { fechados++; return; }
        const chave = `${tipo.id}|${ano}|${mes}`;
        atuais[chave] = atuais[chave] || {};
        atuais[chave][d.profId] = atuais[chave][d.profId] || {};
        if (atuais[chave][d.profId][String(dia)]) { ocupados++; return; }
        atuais[chave][d.profId][String(dia)] = d.cod;
        itens.push({ setor:tipo.id, ano, mes, profissionalId:d.profId, dia, codigo:d.cod });
        gravados++;
      });
      await gravarPlantoesEmLote(itens);
      div.querySelector("#rpResultado").innerHTML = `<div class="msg-ok">✅ ${gravados} plantão(ões) incluído(s).${ocupados?` ${ocupados} dia(s) já tinham plantão e foram mantidos.`:""}${fechados?` ${fechados} ficaram de fora por competência fechada.`:""}</div>`;
      btn.textContent = "Concluído";
      div.querySelector("#rpCancelar").textContent = "Fechar";
      div.querySelector("#rpCancelar").onclick = () => { div.remove(); aoTerminar(); };
    } catch (err) {
      btn.disabled = false; btn.textContent = "Replicar";
      div.querySelector("#rpResultado").innerHTML = `<div class="msg-erro">Erro ao replicar: ${escapeHtml(err.message)}</div>`;
    }
  });
}

// 14b. PLANTONISTAS DE HOJE / AGENDA DO PROFISSIONAL
// -------------------------------------------------------------------------
// Lê direto pelo ID do documento ({setor}_{ano}_{mes}_{profissional}), sem precisar de índice novo.
async function plantoesDoProfissional(profId, dataIni, dataFim) {
  const meses = [];
  for (let d = new Date(dataIni.getFullYear(), dataIni.getMonth(), 1); d <= dataFim; d.setMonth(d.getMonth()+1)) meses.push({ ano:d.getFullYear(), mes:d.getMonth()+1 });
  const lista = [];
  for (const t of ESTADO.cacheTiposEscala) for (const m of meses) {
    const snap = await db.collection("escalas").doc(`${t.id}_${m.ano}_${m.mes}_${profId}`).get();
    if (!snap.exists) continue;
    Object.entries(snap.data().dias||{}).forEach(([dia, cod]) => {
      const data = new Date(m.ano, m.mes-1, +dia);
      if (data < new Date(dataIni.getFullYear(),dataIni.getMonth(),dataIni.getDate()) || data > dataFim) return;
      const info = (t.codigos||[]).find(c => c.codigo === cod);
      lista.push({ data, tipo:t, cod, info });
    });
  }
  return lista.sort((a,b) => (a.data - b.data) || (minutosInicio(a.info) - minutosInicio(b.info)));
}

async function plantonistasDoDia(dt) {
  const ano = dt.getFullYear(), mes = dt.getMonth()+1, dia = String(dt.getDate());
  const profissionais = await carregarProfissionais();
  const lista = [];
  for (const t of ESTADO.cacheTiposEscala) {
    const snap = await db.collection("escalas").where("setor","==",t.id).where("ano","==",ano).where("mes","==",mes).get();
    snap.docs.forEach(d => {
      const x = d.data(); const cod = (x.dias||{})[dia];
      if (!cod) return;
      const info = (t.codigos||[]).find(c => c.codigo === cod);
      lista.push({ tipo:t, cod, info, prof: profissionais.find(p => p.id === x.profissionalId) });
    });
  }
  return lista.sort((a,b) => a.tipo.nome.localeCompare(b.tipo.nome) || (minutosInicio(a.info) - minutosInicio(b.info)));
}
function turnoEmAndamento(info, agora=new Date()) {
  if (!info || !(+info.horas)) return false;
  const ini = minutosInicio(info), fim = ini + (+info.horas)*60;
  const m = agora.getHours()*60 + agora.getMinutes();
  return (m >= ini && m < fim) || (fim > 1440 && m < fim - 1440);
}

async function modalAgendaProfissional(prof) {

      ${lista.map(x => `<tr ${mesmaData(x.data,hoje)?'style="background:#fff7e0"':""}><td>${fmtDiaMes(x.data)}/${x.data.getFullYear()}</td><td>${DIAS_SEMANA[x.data.getDay()]}</td><td>${escapeHtml(x.tipo.nome)}</td>
        <td><span class="ps-card-cod" style="position:static;background:${x.info?.cor||"#999"};color:${corTexto(x.info?.cor||"#999")}">${escapeHtml(x.cod)}</span> ${escapeHtml(x.info?.nome||"")}</td>
        <td>${escapeHtml(x.info?.inicio||"")}–${horaFimTurno(x.info)}</td></tr>`).join("") || `<tr><td colspan="5">Nenhum plantão no período.</td></tr>`}
      </tbody></table></div>`;
  }
  div.querySelector("#agVer").addEventListener("click", carregar);
  carregar();
}

let CACHE_PENDENCIAS_TROCA = { em: 0, qtd: 0 };
async function atualizarBadgeTrocas() {
  const el = document.querySelector('.nav-item[data-tela="trocas"]');
  if (!el) return;
  try {
    if (Date.now() - CACHE_PENDENCIAS_TROCA.em > 60000) {
      const meuProfId = ESTADO.usuarioDoc.profissionalId;
      const podeAprovar = podeEditarTela("trocas");
      const snap = await db.collection("trocas").orderBy("solicitadoEm","desc").limit(200).get();
      const todas = snap.docs.map(d => d.data());
      CACHE_PENDENCIAS_TROCA = { em: Date.now(), qtd:
        todas.filter(t => (meuProfId && t.profissionalDestinoId === meuProfId && t.status === "aguardando_destino") || (podeAprovar && t.status === "aguardando_aprovacao")).length };
    }
    const atual = document.querySelector('.nav-item[data-tela="trocas"]');
    if (atual && CACHE_PENDENCIAS_TROCA.qtd && !atual.querySelector(".nav-badge"))
      atual.insertAdjacentHTML("beforeend", `<span class="nav-badge" title="Trocas aguardando você">${CACHE_PENDENCIAS_TROCA.qtd}</span>`);
  } catch (e) { /* sem permissão ou sem trocas */ }
}

// 14d. BUSCA RÁPIDA NAS TABELAS (Profissionais, Entidades, Usuários, Valores, Log)
// -------------------------------------------------------------------------
function adicionarBuscaTabela(tabela, placeholder) {
  if (!tabela || tabela.dataset.comBusca) return;
  tabela.dataset.comBusca = "1";
  const caixa = document.createElement("div");
  caixa.className = "busca-tabela";
  caixa.innerHTML = `<input type="search" placeholder="🔎 ${escapeHtml(placeholder)}"><span class="busca-contagem"></span>`;
  const host = tabela.closest(".cartao") || tabela.parentElement;
  host.parentElement.insertBefore(caixa, host);
  const input = caixa.querySelector("input"), contagem = caixa.querySelector(".busca-contagem");
  const normal = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  input.addEventListener("input", () => {
    const termos = normal(input.value).split(/\s+/).filter(Boolean);
    let vis = 0, tot = 0;
    tabela.querySelectorAll("tbody tr").forEach(tr => {
      tot++;
      const ok = termos.every(t => normal(tr.textContent).includes(t));
      tr.style.display = ok ? "" : "none"; if (ok) vis++;
    });
    contagem.textContent = termos.length ? `${vis} de ${tot}` : "";
  });
}
function posRenderTela(tela) {
  const vp = document.getElementById("viewport");
  if (!vp) return;
  const tabelas = [...vp.querySelectorAll("table.tabela")];
  const rotulos = {
    "profissionais": ["Buscar por nome, CRM, profissão, entidade..."],
    "entidades": ["Buscar entidade..."],
    "valores-plantao": ["Buscar valor..."],
    "usuarios": ["Buscar perfil...", "Buscar usuário por nome, e-mail, perfil..."],
    "log-acesso": ["Buscar por usuário, data ou tela..."],
    "competencias": ["Buscar competência (ex.: novembro 2026)..."],
  }[tela];
  if (rotulos) tabelas.forEach((t, i) => { if (rotulos[i]) adicionarBuscaTabela(t, rotulos[i]); });
}
